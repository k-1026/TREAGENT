<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1458" width="680" height="1458" role="img">
<title>이용자 유저 플로우</title>
<desc>앱 실행과 세션 확인에서 시작해 로그인, 첫 만남, 홈, 위치 확인, 오늘 선택, 길 만들기, 길 목록, 여행 지도, 경로 변경, 도착 확인, 장소 설명, 미션과 퀴즈, 도장을 거쳐 남은 장소가 있으면 도착 확인으로 돌아가고 없으면 완주와 일기, 장부와 앨범으로 가는 흐름과 에이전트가 들어가는 지점</desc>
<style>
