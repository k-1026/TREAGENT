<rect x="290" y="24" width="100" height="34" rx="8"/>
<text class="th" x="340.0" y="41.0" text-anchor="middle" dominant-baseline="central">시작</text>
</g>
<g class="c-teal">
<rect x="240" y="84" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="101.0" text-anchor="middle" dominant-baseline="central">장면 관문 (코드)</text>
<text class="ts" x="340.0" y="120.0" text-anchor="middle" dominant-baseline="central">요청 종류로 분기</text>
</g>
<g class="c-gray">
