<text class="ts" x="340.0" y="328.0" text-anchor="middle" dominant-baseline="central">힌트 · 질문 · 규칙</text>
</g>
<g class="c-purple">
<rect x="460" y="290" width="180" height="56" rx="8"/>
<text class="th" x="550.0" y="309.0" text-anchor="middle" dominant-baseline="central">대화</text>
