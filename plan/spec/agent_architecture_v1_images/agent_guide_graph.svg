<text class="ts" x="340.0" y="440.0" text-anchor="middle" dominant-baseline="central">사실 · 정답 노출 금지</text>
</g>
<g class="c-teal">
<rect x="520" y="434" width="120" height="52" rx="8"/>
<text class="th" x="580.0" y="451.0" text-anchor="middle" dominant-baseline="central">고정 문장</text>
<text class="ts" x="580.0" y="470.0" text-anchor="middle" dominant-baseline="central">승인 대사</text>
</g>
<g class="c-purple">
<rect x="240" y="494" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="511.0" text-anchor="middle" dominant-baseline="central">평가자 (LLM)</text>
<text class="ts" x="340.0" y="530.0" text-anchor="middle" dominant-baseline="central">말투 · 깊이 · 적합성</text>
</g>
<g class="c-gray">
