<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 756" width="680" height="756" role="img">
<title>운영자(공급자) 플로우</title>
<desc>운영자 로그인, 장소 목록, 장소 운영 상태 변경, 대사와 설명 초안 검수, 연구 결과 검수, 주의 장소 승인, 운영 지표, 페르소나 설정으로 이어지는 운영자 쪽 흐름과 각 단계가 앱과 에이전트에 미치는 영향</desc>
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
.th{font-size:14px;font-weight:700;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#6B6A64;stroke-width:1.5;fill:none}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.zone{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 4}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B6A64" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="756" fill="#FFFFFF"/>
<g class="c-coral">
<rect x="44" y="30" width="270" height="52" rx="8" stroke-dasharray="4 3"/>
<text class="th" x="179.0" y="47.0" text-anchor="middle" dominant-baseline="central">운영자 로그인</text>
<text class="ts" x="179.0" y="66.0" text-anchor="middle" dominant-baseline="central">S-11 · 목업 있음</text>
</g>
<g class="c-teal">
<rect x="344" y="30" width="312" height="52" rx="8"/>
<text class="th" x="500.0" y="47.0" text-anchor="middle" dominant-baseline="central">운영자 권한 확인</text>
<text class="ts" x="500.0" y="66.0" text-anchor="middle" dominant-baseline="central">권한 없으면 접근 거절</text>
</g>
<path d="M315 56.0 L343 56.0" class="arr" stroke-dasharray="4 3"/>
<g class="c-coral">
<rect x="44" y="102" width="270" height="52" rx="8" stroke-dasharray="4 3"/>
<text class="th" x="179.0" y="119.0" text-anchor="middle" dominant-baseline="central">장소 목록</text>
<text class="ts" x="179.0" y="138.0" text-anchor="middle" dominant-baseline="central">S-11</text>
</g>
<g class="c-gray">
<rect x="344" y="102" width="312" height="52" rx="8"/>
<text class="th" x="500.0" y="119.0" text-anchor="middle" dominant-baseline="central">장소 · 운영 상태</text>
<text class="ts" x="500.0" y="138.0" text-anchor="middle" dominant-baseline="central">장소 테이블에서 읽음</text>
</g>
<path d="M315 128.0 L343 128.0" class="arr" stroke-dasharray="4 3"/>
