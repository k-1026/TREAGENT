<path d="M179.0 298 L179.0 317" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral">
<rect x="44" y="390" width="270" height="52" rx="8" stroke-dasharray="4 3"/>
<text class="th" x="179.0" y="407.0" text-anchor="middle" dominant-baseline="central">주의 장소 설명 승인</text>
<text class="ts" x="179.0" y="426.0" text-anchor="middle" dominant-baseline="central">새 화면 제안</text>
</g>
<g class="c-teal">
<rect x="344" y="390" width="312" height="52" rx="8"/>
<text class="th" x="500.0" y="407.0" text-anchor="middle" dominant-baseline="central">식민지 · 전쟁 소재</text>
<text class="ts" x="500.0" y="426.0" text-anchor="middle" dominant-baseline="central">사람이 확인한 뒤 공개</text>
</g>
<path d="M315 416.0 L343 416.0" class="arr" stroke-dasharray="4 3"/>
<path d="M179.0 370 L179.0 389" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral">
<rect x="44" y="462" width="270" height="52" rx="8" stroke-dasharray="4 3"/>
<text class="th" x="179.0" y="479.0" text-anchor="middle" dominant-baseline="central">운영 지표 · 한도 보기</text>
<text class="ts" x="179.0" y="498.0" text-anchor="middle" dominant-baseline="central">새 화면 제안</text>
</g>
<g class="c-teal">
<rect x="344" y="462" width="312" height="52" rx="8"/>
<text class="th" x="500.0" y="479.0" text-anchor="middle" dominant-baseline="central">호출 수 · 실패 · 폴백</text>
<text class="ts" x="500.0" y="498.0" text-anchor="middle" dominant-baseline="central">비용 한도 알림</text>
</g>
<path d="M315 488.0 L343 488.0" class="arr" stroke-dasharray="4 3"/>
<path d="M179.0 442 L179.0 461" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral">
<rect x="44" y="534" width="270" height="52" rx="8" stroke-dasharray="4 3"/>
<text class="th" x="179.0" y="551.0" text-anchor="middle" dominant-baseline="central">페르소나 설정 관리</text>
<text class="ts" x="179.0" y="570.0" text-anchor="middle" dominant-baseline="central">확장 후보</text>
</g>
<g class="c-gray">
<rect x="344" y="534" width="312" height="52" rx="8"/>
<text class="th" x="500.0" y="551.0" text-anchor="middle" dominant-baseline="central">마스코트 교체에 대응</text>
<text class="ts" x="500.0" y="570.0" text-anchor="middle" dominant-baseline="central">[결정 필요]</text>
</g>
<path d="M315 560.0 L343 560.0" class="arr" stroke-dasharray="4 3"/>
<path d="M179.0 514 L179.0 533" class="arr" marker-end="url(#arrow)"/>
