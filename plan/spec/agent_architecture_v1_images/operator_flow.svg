<text class="ts" x="500.0" y="282.0" text-anchor="middle" dominant-baseline="central">운영자 승인 후 게시</text>
</g>
<path d="M315 272.0 L343 272.0" class="arr" stroke-dasharray="4 3"/>
<path d="M179.0 226 L179.0 245" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral">
<rect x="44" y="318" width="270" height="52" rx="8" stroke-dasharray="4 3"/>
<text class="th" x="179.0" y="335.0" text-anchor="middle" dominant-baseline="central">연구 결과 검수</text>
<text class="ts" x="179.0" y="354.0" text-anchor="middle" dominant-baseline="central">새 화면 제안</text>
</g>
<g class="c-purple">
<rect x="344" y="318" width="312" height="52" rx="8"/>
<text class="th" x="500.0" y="335.0" text-anchor="middle" dominant-baseline="central">에이전트 1 연구자 결과</text>
<text class="ts" x="500.0" y="354.0" text-anchor="middle" dominant-baseline="central">근거 묶음 · 출처 승인</text>
</g>
