<rect x="44" y="174" width="270" height="52" rx="8" stroke-dasharray="4 3"/>
<text class="th" x="179.0" y="191.0" text-anchor="middle" dominant-baseline="central">장소 운영 상태 변경</text>
<text class="ts" x="179.0" y="210.0" text-anchor="middle" dominant-baseline="central">S-12 · 휴관 · 재개</text>
</g>
