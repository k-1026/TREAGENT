<rect x="40" y="648" width="290" height="64" rx="8"/>
<text class="th" x="185.0" y="662.0" text-anchor="middle" dominant-baseline="central">후보 A</text>
<text class="ts" x="185.0" y="681.0" text-anchor="middle" dominant-baseline="central">앱 코드를 다시 써서 웹으로</text>
<text class="ts" x="185.0" y="699.0" text-anchor="middle" dominant-baseline="central">(상태 변경 중심)</text>
