<text class="ts" x="495.0" y="699.0" text-anchor="middle" dominant-baseline="central">(코스 · 대사 편집 포함)</text>
</g>
<rect class="c-coral" x="40" y="726" width="12" height="12" rx="2" stroke-dasharray="3 2"/>
<text class="ts" x="58" y="732" dominant-baseline="central">운영자 화면 (모두 아직 없음)</text>
<rect class="c-purple" x="237.68" y="726" width="12" height="12" rx="2"/>
<text class="ts" x="255.68" y="732" dominant-baseline="central">에이전트</text>
<rect class="c-teal" x="324.72" y="726" width="12" height="12" rx="2"/>
<text class="ts" x="342.72" y="732" dominant-baseline="central">코드 · 규칙</text>
</svg>
