<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 810" width="680" height="810" role="img">
<title>기록 정리 서브그래프 (에이전트 3)</title>
<desc>수집과 방문 기록 확인을 거쳐 방문이 없으면 바로 끝나고, 있으면 사실 묶음, 일기 작성, 검증, 평가, 저장을 거쳐 끝나는 그래프. 검증 실패는 재시도하고 재시도가 없으면 틀 일기, 평가 거절은 다시 쓰기로 돌아간다</desc>
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
.th{font-size:14px;font-weight:700;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#6B6A64;stroke-width:1.5;fill:none}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.zone{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 4}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B6A64" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="810" fill="#FFFFFF"/>
<g class="c-gray">
<rect x="290" y="24" width="100" height="34" rx="8"/>
<text class="th" x="340.0" y="41.0" text-anchor="middle" dominant-baseline="central">시작</text>
</g>
<g class="c-teal">
<rect x="225" y="84" width="230" height="52" rx="8"/>
<text class="th" x="340.0" y="101.0" text-anchor="middle" dominant-baseline="central">수집 (코드)</text>
<text class="ts" x="340.0" y="120.0" text-anchor="middle" dominant-baseline="central">방문 · 보여 준 설명 · 퀴즈 결과</text>
</g>
<g class="c-gray">
<rect x="490" y="84" width="150" height="52" rx="8"/>
<text class="th" x="565.0" y="101.0" text-anchor="middle" dominant-baseline="central">공유 상태</text>
<text class="ts" x="565.0" y="120.0" text-anchor="middle" dominant-baseline="central">사실 · 초안</text>
</g>
<g class="c-teal">
<rect x="240" y="174" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="191.0" text-anchor="middle" dominant-baseline="central">방문 기록 확인 (코드)</text>
<text class="ts" x="340.0" y="210.0" text-anchor="middle" dominant-baseline="central">저장된 방문이 있나?</text>
</g>
<g class="c-teal">
<rect x="240" y="264" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="281.0" text-anchor="middle" dominant-baseline="central">사실 묶음 (코드)</text>
<text class="ts" x="340.0" y="300.0" text-anchor="middle" dominant-baseline="central">저장된 사실만</text>
</g>
<g class="c-purple">
<rect x="240" y="354" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="371.0" text-anchor="middle" dominant-baseline="central">일기 작성자</text>
<text class="ts" x="340.0" y="390.0" text-anchor="middle" dominant-baseline="central">페르소나 · 하루 요약</text>
</g>
<g class="c-teal">
<rect x="240" y="444" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="461.0" text-anchor="middle" dominant-baseline="central">검증 (코드)</text>
<text class="ts" x="340.0" y="480.0" text-anchor="middle" dominant-baseline="central">저장된 사실 · 위치 없음</text>
</g>
<g class="c-teal">
<rect x="520" y="444" width="120" height="52" rx="8"/>
<text class="th" x="580.0" y="461.0" text-anchor="middle" dominant-baseline="central">틀 일기</text>
<text class="ts" x="580.0" y="480.0" text-anchor="middle" dominant-baseline="central">빈칸 채우기</text>
</g>
<g class="c-purple">
<rect x="240" y="534" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="551.0" text-anchor="middle" dominant-baseline="central">평가자 (LLM)</text>
<text class="ts" x="340.0" y="570.0" text-anchor="middle" dominant-baseline="central">말투 · 읽기 쉬움</text>
</g>
<g class="c-teal">
<rect x="240" y="624" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="641.0" text-anchor="middle" dominant-baseline="central">저장 (코드)</text>
<text class="ts" x="340.0" y="660.0" text-anchor="middle" dominant-baseline="central">추가만 하는 방식</text>
</g>
<g class="c-gray">
<rect x="290" y="714" width="100" height="34" rx="8"/>
<text class="th" x="340.0" y="731.0" text-anchor="middle" dominant-baseline="central">끝</text>
</g>
<path d="M340 58 L340 82" class="arr" marker-end="url(#arrow)"/>
<path d="M457 110 L488 110" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M340 136 L340 172" class="arr" marker-end="url(#arrow)"/>
<path d="M340 226 L340 262" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="348" y="246" text-anchor="start" dominant-baseline="central">있음</text>
<path d="M440 200 L662 200 L662 731 L392 731" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="550" y="190" text-anchor="middle" dominant-baseline="central">없음: 일기 쓰지 않고 끝</text>
<path d="M340 316 L340 352" class="arr" marker-end="url(#arrow)"/>
<path d="M340 406 L340 442" class="arr" marker-end="url(#arrow)"/>
<path d="M440 458 L478 458 L478 380 L442 380" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="486" y="420" text-anchor="start" dominant-baseline="central">실패: 다시 쓰기</text>
<path d="M442 484 L518 484" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="480" y="508" text-anchor="middle" dominant-baseline="central">재시도 소진</text>
<path d="M340 496 L340 532" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="348" y="516" text-anchor="start" dominant-baseline="central">통과</text>
<path d="M240 560 L200 560 L200 380 L238 380" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="196" y="470" text-anchor="end" dominant-baseline="central">거절: 다시 쓰기</text>
<path d="M340 586 L340 622" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="348" y="606" text-anchor="start" dominant-baseline="central">승인</text>
<path d="M580 496 L580 650 L442 650" class="arr" marker-end="url(#arrow)"/>
<path d="M340 676 L340 712" class="arr" marker-end="url(#arrow)"/>
<rect class="c-teal" x="40" y="770" width="12" height="12" rx="2"/>
<text class="ts" x="58" y="776" dominant-baseline="central">코드 단계</text>
<rect class="c-purple" x="130.64" y="770" width="12" height="12" rx="2"/>
<text class="ts" x="148.64" y="776" dominant-baseline="central">LLM 단계</text>
<rect class="c-gray" x="218.64" y="770" width="12" height="12" rx="2"/>
<text class="ts" x="236.64" y="776" dominant-baseline="central">상태 · 시작 · 끝</text>
</svg>
