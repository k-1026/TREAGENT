<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 930" width="680" height="930" role="img">
<title>미션 에이전트 서브그래프</title>
<desc>도착 확인, 장소 설명 작성, 설명 코드 검증과 LLM 검토, 종류 고르기를 거쳐 퀴즈, 인증샷, 영수증 에이전트 중 하나로 가고, 판정 확인을 통과하면 도장 기록으로 가는 그래프</desc>
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
.th{font-size:14px;font-weight:700;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#6B6A64;stroke-width:1.5;fill:none}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.zone{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 4}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B6A64" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="930" fill="#FFFFFF"/>
<g class="c-gray">
<rect x="290" y="24" width="100" height="34" rx="8"/>
<text class="th" x="340.0" y="41.0" text-anchor="middle" dominant-baseline="central">시작</text>
</g>
<g class="c-teal">
<rect x="240" y="84" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="101" text-anchor="middle" dominant-baseline="central">도착 확인 (코드)</text>
<text class="ts" x="340.0" y="120" text-anchor="middle" dominant-baseline="central">GPS 반경 · 서버 계산</text>
</g>
<g class="c-purple">
<rect x="240" y="174" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="191" text-anchor="middle" dominant-baseline="central">장소 설명 작성</text>
<text class="ts" x="340.0" y="210" text-anchor="middle" dominant-baseline="central">LLM · 근거 있는 설명만</text>
</g>
<g class="c-teal">
<rect x="240" y="264" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="281" text-anchor="middle" dominant-baseline="central">설명 코드 검증</text>
<text class="ts" x="340.0" y="300" text-anchor="middle" dominant-baseline="central">근거 id · 금칙어 · 길이</text>
</g>
<g class="c-purple">
<rect x="240" y="354" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="371" text-anchor="middle" dominant-baseline="central">설명 LLM 검토</text>
<text class="ts" x="340.0" y="390" text-anchor="middle" dominant-baseline="central">사실과 맞는지 · 말투</text>
</g>
<g class="c-purple">
<rect x="240" y="444" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="461" text-anchor="middle" dominant-baseline="central">종류 고르기</text>
<text class="ts" x="340.0" y="480" text-anchor="middle" dominant-baseline="central">LLM · 허용 종류 안에서</text>
</g>
<g class="c-gray">
<rect x="520" y="309" width="120" height="52" rx="8"/>
<text class="th" x="580.0" y="326" text-anchor="middle" dominant-baseline="central">폴백</text>
<text class="ts" x="580.0" y="345" text-anchor="middle" dominant-baseline="central">고정 설명</text>
</g>
<g class="c-purple">
<rect x="40" y="564" width="180" height="56" rx="8"/>
<text class="th" x="130.0" y="581" text-anchor="middle" dominant-baseline="central">퀴즈 에이전트</text>
<text class="ts" x="130.0" y="600" text-anchor="middle" dominant-baseline="central">출제 · 점검 · 판정</text>
</g>
<g class="c-purple">
<rect x="250" y="564" width="180" height="56" rx="8"/>
<text class="th" x="340.0" y="581" text-anchor="middle" dominant-baseline="central">인증샷 에이전트</text>
<text class="ts" x="340.0" y="600" text-anchor="middle" dominant-baseline="central">출제 · 점검 · 판정</text>
</g>
<g class="c-purple">
<rect x="460" y="564" width="180" height="56" rx="8"/>
<text class="th" x="550.0" y="581" text-anchor="middle" dominant-baseline="central">영수증 에이전트</text>
<text class="ts" x="550.0" y="600" text-anchor="middle" dominant-baseline="central">출제 · 점검 · 판정</text>
</g>
<g class="c-teal">
<rect x="240" y="684" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="701" text-anchor="middle" dominant-baseline="central">도장 기록 (코드)</text>
<text class="ts" x="340.0" y="720" text-anchor="middle" dominant-baseline="central">판정 확인 뒤에만 · 추가만</text>
</g>
<g class="c-gray">
<rect x="290" y="774" width="100" height="34" rx="8"/>
<text class="th" x="340.0" y="791.0" text-anchor="middle" dominant-baseline="central">끝</text>
</g>
<path d="M340 58 L340 82" class="arr" marker-end="url(#arrow)"/>
<path d="M340 136 L340 172" class="arr" marker-end="url(#arrow)"/>
<path d="M340 226 L340 262" class="arr" marker-end="url(#arrow)"/>
<path d="M340 316 L340 352" class="arr" marker-end="url(#arrow)"/>
<path d="M340 406 L340 442" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="348" y="242" text-anchor="start" dominant-baseline="central">통과</text>
<text class="ts" x="348" y="332" text-anchor="start" dominant-baseline="central">코드 통과</text>
<text class="ts" x="348" y="426" text-anchor="start" dominant-baseline="central">LLM 통과</text>
<path d="M240 290 L200 290 L200 200 L238 200" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="196" y="245" text-anchor="end" dominant-baseline="central">코드 실패: 다시 쓰기</text>
<path d="M240 380 L200 380 L200 290" class="arr"/>
<text class="ts" x="196" y="335" text-anchor="end" dominant-baseline="central">LLM 거절: 다시 쓰기</text>
<path d="M442 380 L580 380 L580 363" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="588" y="400" text-anchor="start" dominant-baseline="central">재시도 소진</text>
<path d="M442 290 L580 290 L580 307" class="arr" marker-end="url(#arrow)"/>
<path d="M640 335 L664 335 L664 470 L442 470" class="arr" marker-end="url(#arrow)"/>
<path d="M340 496 L340 522 L130 522 L130 562" class="arr" marker-end="url(#arrow)"/>
<path d="M340 496 L340 562" class="arr" marker-end="url(#arrow)"/>
<path d="M340 522 L550 522 L550 562" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="235" y="512" text-anchor="middle" dominant-baseline="central">종류별</text>
<path d="M130 620 L130 646 L340 646 L340 682" class="arr" marker-end="url(#arrow)"/>
<path d="M340 620 L340 682" class="arr" marker-end="url(#arrow)"/>
<path d="M550 620 L550 646 L340 646" class="arr"/>
<path d="M340 736 L340 772" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="40" y="820" text-anchor="start" dominant-baseline="central">검증은 코드 검증을 먼저 하고, 통과한 것만 LLM 검토로 넘깁니다. 둘 다 통과해야 다음으로 갑니다.</text>
<text class="ts" x="40" y="840" text-anchor="start" dominant-baseline="central">종류마다 에이전트가 따로 있고, 각자 출제 · 검증 · 제출 점검 · 판정을 가집니다. 힌트는 퀴즈에만 있습니다 (종류별 그림 참고).</text>
<text class="ts" x="40" y="860" text-anchor="start" dominant-baseline="central">판정은 LLM(Gemini)이 하고, 도장은 코드가 판정 확인을 거쳐 기록합니다. 모든 단계의 결과는 실행 기록에 추가됩니다.</text>
<rect class="c-teal" x="40" y="884" width="12" height="12" rx="2"/>
<text class="ts" x="58" y="890" dominant-baseline="central">코드 단계</text>
<rect class="c-purple" x="143" y="884" width="12" height="12" rx="2"/>
<text class="ts" x="161" y="890" dominant-baseline="central">LLM 단계</text>
<rect class="c-gray" x="259" y="884" width="12" height="12" rx="2"/>
<text class="ts" x="277" y="890" dominant-baseline="central">시작 · 끝 · 폴백</text>
</svg>
