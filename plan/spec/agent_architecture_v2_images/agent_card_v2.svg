<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1060" width="680" height="1060" role="img">
<title>하랑이 카드 서브그래프</title>
<desc>완주 기록과 코스 테마로 프롬프트를 쓰고 Gemini로 이미지를 만들어 코드 검증과 LLM 검토를 거친 뒤 코드가 템플릿에 조립해 저장하며, 실패하면 고정 카드 틀로 내려가는 그래프</desc>
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
.th{font-size:14px;font-weight:700;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#6B6A64;stroke-width:1.5;fill:none}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.zone{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 4}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B6A64" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="1060" fill="#FFFFFF"/>
<g class="c-gray">
<rect x="290" y="24" width="100" height="34" rx="8"/>
<text class="th" x="340.0" y="41.0" text-anchor="middle" dominant-baseline="central">시작</text>
</g>
<g class="c-teal">
<rect x="240" y="84" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="101" text-anchor="middle" dominant-baseline="central">사실 묶음 (코드)</text>
<text class="ts" x="340.0" y="120" text-anchor="middle" dominant-baseline="central">완주 기록 · 코스 테마 · 좌표 제거</text>
</g>
<g class="c-purple">
<rect x="240" y="174" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="191" text-anchor="middle" dominant-baseline="central">프롬프트 작성자</text>
<text class="ts" x="340.0" y="210" text-anchor="middle" dominant-baseline="central">코스 테마 · 미션 결과 · LLM</text>
</g>
<g class="c-purple">
<rect x="240" y="264" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="281" text-anchor="middle" dominant-baseline="central">이미지 생성</text>
<text class="ts" x="340.0" y="300" text-anchor="middle" dominant-baseline="central">Gemini · 이미지</text>
</g>
<g class="c-teal">
<rect x="240" y="354" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="371" text-anchor="middle" dominant-baseline="central">이미지 코드 검증</text>
<text class="ts" x="340.0" y="390" text-anchor="middle" dominant-baseline="central">크기 · 형식 · 파일</text>
</g>
<g class="c-purple">
<rect x="240" y="444" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="461" text-anchor="middle" dominant-baseline="central">이미지 LLM 검토</text>
<text class="ts" x="340.0" y="480" text-anchor="middle" dominant-baseline="central">Gemini 비전 · 캐릭터 일치</text>
</g>
<g class="c-teal">
<rect x="240" y="534" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="551" text-anchor="middle" dominant-baseline="central">카드 조립 (코드)</text>
<text class="ts" x="340.0" y="570" text-anchor="middle" dominant-baseline="central">템플릿 · 장소명 · 도장 · 날짜</text>
</g>
<g class="c-teal">
<rect x="240" y="624" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="641" text-anchor="middle" dominant-baseline="central">카드 저장 (코드)</text>
<text class="ts" x="340.0" y="660" text-anchor="middle" dominant-baseline="central">추가만</text>
</g>
<g class="c-gray">
<rect x="290" y="714" width="100" height="34" rx="8"/>
<text class="th" x="340.0" y="731.0" text-anchor="middle" dominant-baseline="central">끝</text>
</g>
<g class="c-gray">
<rect x="520" y="354" width="120" height="52" rx="8"/>
<text class="th" x="580.0" y="371" text-anchor="middle" dominant-baseline="central">폴백</text>
<text class="ts" x="580.0" y="390" text-anchor="middle" dominant-baseline="central">고정 카드 틀</text>
</g>
<path d="M340 58 L340 82" class="arr" marker-end="url(#arrow)"/>
<path d="M340 136 L340 172" class="arr" marker-end="url(#arrow)"/>
<path d="M340 226 L340 262" class="arr" marker-end="url(#arrow)"/>
<path d="M340 316 L340 352" class="arr" marker-end="url(#arrow)"/>
<path d="M340 406 L340 442" class="arr" marker-end="url(#arrow)"/>
<path d="M340 496 L340 532" class="arr" marker-end="url(#arrow)"/>
<path d="M340 586 L340 622" class="arr" marker-end="url(#arrow)"/>
<path d="M340 676 L340 712" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="348" y="156" text-anchor="start" dominant-baseline="central">미션마다 한 장</text>
<text class="ts" x="348" y="336" text-anchor="start" dominant-baseline="central">통과</text>
<text class="ts" x="348" y="426" text-anchor="start" dominant-baseline="central">코드 통과</text>
<text class="ts" x="348" y="516" text-anchor="start" dominant-baseline="central">LLM 통과</text>
<path d="M240 380 L200 380 L200 200 L238 200" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="196" y="290" text-anchor="end" dominant-baseline="central">코드 실패: 다시 작성</text>
<path d="M240 470 L200 470 L200 380" class="arr"/>
<text class="ts" x="196" y="425" text-anchor="end" dominant-baseline="central">LLM 불통과: 다시 작성</text>
<path d="M442 380 L518 380" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="480" y="404" text-anchor="middle" dominant-baseline="central">재시도 소진</text>
<path d="M442 470 L580 470 L580 408" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="588" y="440" text-anchor="start" dominant-baseline="central">재시도 소진</text>
<path d="M640 380 L664 380 L664 560 L442 560" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="40" y="760" text-anchor="start" dominant-baseline="central">코스를 완주한 뒤에, 미션 결과마다 카드 한 장을 만듭니다.</text>
<text class="ts" x="40" y="780" text-anchor="start" dominant-baseline="central">카드마다 호출이 늘어 비용 한도가 필요합니다.</text>
<text class="ts" x="40" y="800" text-anchor="start" dominant-baseline="central">프롬프트 작성자는 코스 설계가 쓴 테마를 그대로 받아 씁니다.</text>
<text class="ts" x="40" y="820" text-anchor="start" dominant-baseline="central">별도의 기획 단계는 없습니다.</text>
<text class="ts" x="40" y="840" text-anchor="start" dominant-baseline="central">카드 문구는 템플릿(코드)이 채웁니다.</text>
<text class="ts" x="40" y="860" text-anchor="start" dominant-baseline="central">주의 소재 · 허가 없는 이름이 걸리면 사실 묶음 단계에서</text>
<text class="ts" x="40" y="880" text-anchor="start" dominant-baseline="central">그 카드는 고정 카드 틀로 보냅니다.</text>
<text class="ts" x="40" y="900" text-anchor="start" dominant-baseline="central">검증은 코드 검증을 먼저 하고, 통과한 것만 LLM 검토로 넘깁니다.</text>
<text class="ts" x="40" y="920" text-anchor="start" dominant-baseline="central">이용자 사진 · 영수증은 카드 재료로 쓰지 않습니다.</text>
<text class="ts" x="40" y="940" text-anchor="start" dominant-baseline="central">캐릭터는 고정 시트(brand/character)를 따르고,</text>
<text class="ts" x="40" y="960" text-anchor="start" dominant-baseline="central">프롬프트는 prompts.md에 기록합니다.</text>
<text class="ts" x="40" y="980" text-anchor="start" dominant-baseline="central">모든 단계의 결과는 실행 기록에 추가됩니다.</text>
<rect class="c-teal" x="40" y="1024" width="12" height="12" rx="2"/>
<text class="ts" x="58" y="1030" dominant-baseline="central">코드 단계</text>
<rect class="c-purple" x="143" y="1024" width="12" height="12" rx="2"/>
<text class="ts" x="161" y="1030" dominant-baseline="central">LLM 단계</text>
<rect class="c-gray" x="259" y="1024" width="12" height="12" rx="2"/>
<text class="ts" x="277" y="1030" dominant-baseline="central">시작 · 끝 · 폴백</text>
</svg>
