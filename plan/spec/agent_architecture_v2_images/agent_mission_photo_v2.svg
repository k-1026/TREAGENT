<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1030" width="680" height="1030" role="img">
<title>인증샷 에이전트 서브그래프</title>
<desc>찍을 과제를 출제하고 코드 검증과 LLM 검토를 거친 뒤 이용자의 사진을 점검하고 Gemini가 이미지를 판정하며, 코드가 판정을 확인해 도장을 기록하는 그래프</desc>
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
.th{font-size:14px;font-weight:700;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#6B6A64;stroke-width:1.5;fill:none}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.zone{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 4}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B6A64" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="1030" fill="#FFFFFF"/>
<g class="c-gray">
<rect x="290" y="24" width="100" height="34" rx="8"/>
<text class="th" x="340.0" y="41.0" text-anchor="middle" dominant-baseline="central">시작</text>
</g>
<g class="c-purple">
<rect x="240" y="84" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="101" text-anchor="middle" dominant-baseline="central">출제자 (인증샷)</text>
<text class="ts" x="340.0" y="120" text-anchor="middle" dominant-baseline="central">찍을 대상 · 구도 안내</text>
</g>
<g class="c-teal">
<rect x="240" y="174" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="191" text-anchor="middle" dominant-baseline="central">출제 코드 검증</text>
<text class="ts" x="340.0" y="210" text-anchor="middle" dominant-baseline="central">형식 · 장소 · 영업 여부</text>
</g>
<g class="c-purple">
<rect x="240" y="264" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="281" text-anchor="middle" dominant-baseline="central">출제 LLM 검토</text>
<text class="ts" x="340.0" y="300" text-anchor="middle" dominant-baseline="central">찍을 대상 · 구도 명확</text>
</g>
<g class="c-coral">
<rect x="240" y="354" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="371" text-anchor="middle" dominant-baseline="central">이용자 사진 제출</text>
<text class="ts" x="340.0" y="390" text-anchor="middle" dominant-baseline="central">사진 한 장</text>
</g>
<g class="c-teal">
<rect x="240" y="444" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="461" text-anchor="middle" dominant-baseline="central">제출 점검 (코드)</text>
<text class="ts" x="340.0" y="480" text-anchor="middle" dominant-baseline="central">GPS · 중복 · EXIF 제거</text>
</g>
<g class="c-purple">
<rect x="240" y="534" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="551" text-anchor="middle" dominant-baseline="central">사진 판정 (Gemini · 이미지)</text>
<text class="ts" x="340.0" y="570" text-anchor="middle" dominant-baseline="central">과제와 일치 · 부적절 여부</text>
</g>
<g class="c-teal">
<rect x="240" y="624" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="641" text-anchor="middle" dominant-baseline="central">판정 확인 (코드)</text>
<text class="ts" x="340.0" y="660" text-anchor="middle" dominant-baseline="central">거부권 · GPS · 중복 · 1회</text>
</g>
<g class="c-teal">
<rect x="240" y="714" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="731" text-anchor="middle" dominant-baseline="central">도장 기록 (코드)</text>
<text class="ts" x="340.0" y="750" text-anchor="middle" dominant-baseline="central">추가만 · 중복 없음</text>
</g>
<g class="c-gray">
<rect x="290" y="804" width="100" height="34" rx="8"/>
<text class="th" x="340.0" y="821.0" text-anchor="middle" dominant-baseline="central">끝</text>
</g>
<g class="c-gray">
<rect x="40" y="624" width="150" height="52" rx="8"/>
<text class="th" x="115.0" y="641" text-anchor="middle" dominant-baseline="central">폴백</text>
<text class="ts" x="115.0" y="660" text-anchor="middle" dominant-baseline="central">도장 보류 · 준비된 과제</text>
</g>
<g class="c-teal">
<rect x="500" y="354" width="140" height="52" rx="8"/>
<text class="th" x="570.0" y="371" text-anchor="middle" dominant-baseline="central">다시 보기 (코드)</text>
<text class="ts" x="570.0" y="390" text-anchor="middle" dominant-baseline="central">출제 안내문 재표시</text>
</g>
<path d="M340 58 L340 82" class="arr" marker-end="url(#arrow)"/>
<path d="M340 136 L340 172" class="arr" marker-end="url(#arrow)"/>
<path d="M340 226 L340 262" class="arr" marker-end="url(#arrow)"/>
<path d="M340 316 L340 352" class="arr" marker-end="url(#arrow)"/>
<path d="M340 406 L340 442" class="arr" marker-end="url(#arrow)"/>
<path d="M340 496 L340 532" class="arr" marker-end="url(#arrow)"/>
<path d="M340 586 L340 622" class="arr" marker-end="url(#arrow)"/>
<path d="M340 676 L340 712" class="arr" marker-end="url(#arrow)"/>
<path d="M340 766 L340 802" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="348" y="242" text-anchor="start" dominant-baseline="central">코드 통과</text>
<text class="ts" x="348" y="336" text-anchor="start" dominant-baseline="central">LLM 통과</text>
<text class="ts" x="348" y="516" text-anchor="start" dominant-baseline="central">통과</text>
<text class="ts" x="348" y="606" text-anchor="start" dominant-baseline="central">LLM 통과</text>
<text class="ts" x="348" y="696" text-anchor="start" dominant-baseline="central">통과</text>
<path d="M240 200 L200 200 L200 110 L238 110" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="196" y="155" text-anchor="end" dominant-baseline="central">코드 실패: 다시 출제</text>
<path d="M240 290 L200 290 L200 200" class="arr"/>
<text class="ts" x="196" y="245" text-anchor="end" dominant-baseline="central">LLM 거절: 다시 출제</text>
<path d="M240 470 L200 470 L200 380 L238 380" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="196" y="425" text-anchor="end" dominant-baseline="central">점검 실패: 다시 제출</text>
<path d="M440 650 L470 650 L470 386 L442 386" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="478" y="640" text-anchor="start" dominant-baseline="central">불통과: 다시 제출</text>
<path d="M240 650 L192 650" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="215" y="692" text-anchor="middle" dominant-baseline="central">재시도 소진</text>
<path d="M115 676 L115 821 L288 821" class="arr" marker-end="url(#arrow)"/>
<path d="M442 370 L498 370" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="470" y="358" text-anchor="middle" dominant-baseline="central">다시 보기</text>
<text class="ts" x="40" y="870" text-anchor="start" dominant-baseline="central">검증은 코드 검증을 먼저 하고, 통과한 것만 LLM 검토로 넘깁니다. 둘 다 통과해야 다음으로 갑니다.</text>
<text class="ts" x="40" y="890" text-anchor="start" dominant-baseline="central">판정은 Gemini(LLM)가 하고, 도장은 코드가 판정 확인을 통과한 것만 기록합니다 (절대 규칙 3).</text>
<text class="ts" x="40" y="910" text-anchor="start" dominant-baseline="central">모든 단계의 결과와 판정은 실행 기록에 추가됩니다.</text>
<text class="ts" x="40" y="930" text-anchor="start" dominant-baseline="central">사진은 EXIF를 제거한 뒤에만 Gemini로 보내고 원본은 저장하지 않습니다. 사진 범위는 D-17 확인 필요.</text>
<text class="ts" x="40" y="950" text-anchor="start" dominant-baseline="central">힌트 대신 출제 안내문을 다시 보여 줍니다 (코드, LLM 호출 없음).</text>
<rect class="c-teal" x="40" y="994" width="12" height="12" rx="2"/>
<text class="ts" x="58" y="1000" dominant-baseline="central">코드 단계</text>
<rect class="c-purple" x="143" y="994" width="12" height="12" rx="2"/>
<text class="ts" x="161" y="1000" dominant-baseline="central">LLM 단계</text>
<rect class="c-gray" x="259" y="994" width="12" height="12" rx="2"/>
<text class="ts" x="277" y="1000" dominant-baseline="central">시작 · 끝 · 폴백</text>
<rect class="c-coral" x="440" y="994" width="12" height="12" rx="2"/>
<text class="ts" x="458" y="1000" dominant-baseline="central">사람 · 이용자</text>
</svg>
