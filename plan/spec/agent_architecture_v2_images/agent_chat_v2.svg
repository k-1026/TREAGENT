<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 690" width="680" height="690" role="img">
<title>하랑이와 이야기하기 서브그래프</title>
<desc>안전 점검, 분류, 근거 조회, 답변 작성, 답변 검증을 거쳐 끝나고, 위험하거나 재시도가 없으면 고정 문장으로 가며, 검증 실패는 다시 쓰는 그래프</desc>
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
.th{font-size:14px;font-weight:700;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#6B6A64;stroke-width:1.5;fill:none}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.zone{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 4}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B6A64" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="690" fill="#FFFFFF"/>
<g class="c-gray">
<rect x="290" y="24" width="100" height="34" rx="8"/>
<text class="th" x="340.0" y="41.0" text-anchor="middle" dominant-baseline="central">시작</text>
</g>
<g class="c-teal">
<rect x="240" y="84" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="101" text-anchor="middle" dominant-baseline="central">안전 점검 (코드)</text>
<text class="ts" x="340.0" y="120" text-anchor="middle" dominant-baseline="central">위험 표현 거르기</text>
</g>
<g class="c-purple">
<rect x="240" y="174" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="191" text-anchor="middle" dominant-baseline="central">분류</text>
<text class="ts" x="340.0" y="210" text-anchor="middle" dominant-baseline="central">질문 · 규칙 · 잡담</text>
</g>
<g class="c-teal">
<rect x="240" y="264" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="281" text-anchor="middle" dominant-baseline="central">근거 조회 (코드)</text>
<text class="ts" x="340.0" y="300" text-anchor="middle" dominant-baseline="central">읽기 도구 · 정답 제외</text>
</g>
<g class="c-purple">
<rect x="240" y="354" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="371" text-anchor="middle" dominant-baseline="central">답변 작성</text>
<text class="ts" x="340.0" y="390" text-anchor="middle" dominant-baseline="central">하랑이 말투</text>
</g>
<g class="c-teal">
<rect x="240" y="444" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="461" text-anchor="middle" dominant-baseline="central">답변 검증 (코드)</text>
<text class="ts" x="340.0" y="480" text-anchor="middle" dominant-baseline="central">금칙어 · 근거 · 안전</text>
</g>
<g class="c-gray">
<rect x="520" y="264" width="120" height="52" rx="8"/>
<text class="th" x="580.0" y="281" text-anchor="middle" dominant-baseline="central">폴백</text>
<text class="ts" x="580.0" y="300" text-anchor="middle" dominant-baseline="central">고정 문장</text>
</g>
<g class="c-gray">
<rect x="290" y="534" width="100" height="34" rx="8"/>
<text class="th" x="340.0" y="551.0" text-anchor="middle" dominant-baseline="central">끝</text>
</g>
<path d="M340 58 L340 82" class="arr" marker-end="url(#arrow)"/>
<path d="M340 136 L340 172" class="arr" marker-end="url(#arrow)"/>
<path d="M340 226 L340 262" class="arr" marker-end="url(#arrow)"/>
<path d="M340 316 L340 352" class="arr" marker-end="url(#arrow)"/>
<path d="M340 406 L340 442" class="arr" marker-end="url(#arrow)"/>
<path d="M340 496 L340 532" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="348" y="514" text-anchor="start" dominant-baseline="central">통과</text>
<path d="M442 110 L580 110 L580 262" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="511" y="98" text-anchor="middle" dominant-baseline="central">위험하면 고정 안내</text>
<path d="M442 470 L580 470 L580 318" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="588" y="400" text-anchor="start" dominant-baseline="central">재시도 소진</text>
<path d="M640 290 L664 290 L664 551 L392 551" class="arr" marker-end="url(#arrow)"/>
<path d="M240 470 L200 470 L200 380 L238 380" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="196" y="425" text-anchor="end" dominant-baseline="central">실패: 다시 쓰기</text>
<text class="ts" x="40" y="600" text-anchor="start" dominant-baseline="central">질문 · 게임 규칙 · 잡담만 맡습니다. 장소 설명과 힌트는 미션 에이전트가 합니다.</text>
<text class="ts" x="40" y="620" text-anchor="start" dominant-baseline="central">모든 단계의 결과와 판정은 실행 기록에 추가됩니다.</text>
<rect class="c-teal" x="40" y="654" width="12" height="12" rx="2"/>
<text class="ts" x="58" y="660" dominant-baseline="central">코드 단계</text>
<rect class="c-purple" x="143" y="654" width="12" height="12" rx="2"/>
<text class="ts" x="161" y="660" dominant-baseline="central">LLM 단계</text>
<rect class="c-gray" x="259" y="654" width="12" height="12" rx="2"/>
<text class="ts" x="277" y="660" dominant-baseline="central">상태 · 시작 · 끝</text>
</svg>
