<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" width="680" height="590" role="img">
<title>기록 정리 서브그래프</title>
<desc>사실 묶음으로 일기를 쓰고 검증을 통과하면 저장하며, 실패하면 다시 쓰고 재시도가 없으면 틀 일기로 저장하고, 방문 기록이 없으면 바로 끝나는 그래프</desc>
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
.th{font-size:14px;font-weight:700;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#6B6A64;stroke-width:1.5;fill:none}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.zone{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 4}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B6A64" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="590" fill="#FFFFFF"/>
<g class="c-gray">
<rect x="290" y="24" width="100" height="34" rx="8"/>
<text class="th" x="340.0" y="41.0" text-anchor="middle" dominant-baseline="central">시작</text>
</g>
<g class="c-teal">
<rect x="240" y="84" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="101" text-anchor="middle" dominant-baseline="central">사실 묶음 (코드)</text>
<text class="ts" x="340.0" y="120" text-anchor="middle" dominant-baseline="central">방문 · 도장 · 퀴즈 결과</text>
</g>
<g class="c-purple">
<rect x="240" y="174" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="191" text-anchor="middle" dominant-baseline="central">일기 작성</text>
<text class="ts" x="340.0" y="210" text-anchor="middle" dominant-baseline="central">사실 묶음 밖은 쓰지 않음</text>
</g>
<g class="c-teal">
<rect x="240" y="264" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="281" text-anchor="middle" dominant-baseline="central">검증 (코드)</text>
<text class="ts" x="340.0" y="300" text-anchor="middle" dominant-baseline="central">좌표 · 금칙어 · 길이</text>
</g>
<g class="c-teal">
<rect x="240" y="354" width="200" height="52" rx="8"/>
<text class="th" x="340.0" y="371" text-anchor="middle" dominant-baseline="central">일기 저장 (코드)</text>
<text class="ts" x="340.0" y="390" text-anchor="middle" dominant-baseline="central">추가만</text>
</g>
<g class="c-teal">
<rect x="520" y="264" width="120" height="52" rx="8"/>
<text class="th" x="580.0" y="281" text-anchor="middle" dominant-baseline="central">틀 일기</text>
<text class="ts" x="580.0" y="300" text-anchor="middle" dominant-baseline="central">빈칸에 사실 채움</text>
</g>
<g class="c-gray">
<rect x="290" y="444" width="100" height="34" rx="8"/>
<text class="th" x="340.0" y="461.0" text-anchor="middle" dominant-baseline="central">끝</text>
</g>
<path d="M340 58 L340 82" class="arr" marker-end="url(#arrow)"/>
<path d="M340 136 L340 172" class="arr" marker-end="url(#arrow)"/>
<path d="M340 226 L340 262" class="arr" marker-end="url(#arrow)"/>
<path d="M340 316 L340 352" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="348" y="334" text-anchor="start" dominant-baseline="central">통과</text>
<path d="M340 406 L340 442" class="arr" marker-end="url(#arrow)"/>
<path d="M240 290 L200 290 L200 200 L238 200" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="196" y="245" text-anchor="end" dominant-baseline="central">실패: 다시 쓰기</text>
<path d="M442 290 L518 290" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="480" y="314" text-anchor="middle" dominant-baseline="central">재시도 소진</text>
<path d="M580 316 L580 380 L442 380" class="arr" marker-end="url(#arrow)"/>
<path d="M442 110 L664 110 L664 461 L392 461" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="540" y="98" text-anchor="middle" dominant-baseline="central">방문 기록이 없으면 끝</text>
<text class="ts" x="40" y="510" text-anchor="start" dominant-baseline="central">방문 · 도장 · 퀴즈 결과가 서버에 저장되어 있어야 동작합니다.</text>
<text class="ts" x="40" y="530" text-anchor="start" dominant-baseline="central">모든 단계의 결과와 판정은 실행 기록에 추가됩니다.</text>
<rect class="c-teal" x="40" y="554" width="12" height="12" rx="2"/>
<text class="ts" x="58" y="560" dominant-baseline="central">코드 단계</text>
<rect class="c-purple" x="143" y="554" width="12" height="12" rx="2"/>
<text class="ts" x="161" y="560" dominant-baseline="central">LLM 단계</text>
<rect class="c-gray" x="259" y="554" width="12" height="12" rx="2"/>
<text class="ts" x="277" y="560" dominant-baseline="central">상태 · 시작 · 끝</text>
</svg>
