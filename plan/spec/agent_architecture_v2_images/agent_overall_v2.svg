<rect x="40" y="518" width="600" height="52" rx="8"/>
<text class="th" x="340.0" y="535" text-anchor="middle" dominant-baseline="central">실행 기록 DB</text>
<text class="ts" x="340.0" y="554" text-anchor="middle" dominant-baseline="central">단계별 결과 · 판정 사유 · 호출 수</text>
</g>
<path d="M540 518 L540 456" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="548" y="502" text-anchor="start" dominant-baseline="central">기록 읽기</text>
<rect class="c-teal" x="40" y="598" width="12" height="12" rx="2"/>
<text class="ts" x="58" y="604" dominant-baseline="central">코드 단계</text>
<rect class="c-purple" x="143" y="598" width="12" height="12" rx="2"/>
<text class="ts" x="161" y="604" dominant-baseline="central">LLM 단계</text>
<rect class="c-gray" x="259" y="598" width="12" height="12" rx="2"/>
<text class="ts" x="277" y="604" dominant-baseline="central">상태 · 시작 · 끝</text>
<rect class="c-coral" x="440" y="598" width="12" height="12" rx="2"/>
<text class="ts" x="458" y="604" dominant-baseline="central">사람 · 이용자</text>
</svg>
