<text class="th" x="217.0" y="221" text-anchor="middle" dominant-baseline="central">미션</text>
<text class="ts" x="217.0" y="240" text-anchor="middle" dominant-baseline="central">설명 · 출제 · 판정</text>
</g>
<path d="M340 136 L340 156 L217 156 L217 202" class="arr" marker-end="url(#arrow)"/>
<path d="M217 264 L217 298" class="arr" marker-end="url(#arrow)"/>
