<rect x="532" y="204" width="108" height="60" rx="8"/>
<text class="th" x="586.0" y="221" text-anchor="middle" dominant-baseline="central">하랑이 카드</text>
<text class="ts" x="586.0" y="240" text-anchor="middle" dominant-baseline="central">완주 카드 생성</text>
</g>
<path d="M340 136 L340 156 L586 156 L586 202" class="arr" marker-end="url(#arrow)"/>
<path d="M586 264 L586 298" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray">
<rect x="40" y="300" width="600" height="44" rx="8"/>
<text class="th" x="340.0" y="322.0" text-anchor="middle" dominant-baseline="central">장소 DB · 에이전트는 읽기만</text>
</g>
<g class="c-purple">
<rect x="40" y="394" width="200" height="60" rx="8"/>
<text class="th" x="140.0" y="411" text-anchor="middle" dominant-baseline="central">장소 DB 갱신</text>
<text class="ts" x="140.0" y="430" text-anchor="middle" dominant-baseline="central">후보 발굴 · 확인 · 반영</text>
</g>
<g class="c-coral">
<rect x="440" y="394" width="200" height="60" rx="8"/>
<text class="th" x="540.0" y="411" text-anchor="middle" dominant-baseline="central">관리자 웹</text>
<text class="ts" x="540.0" y="430" text-anchor="middle" dominant-baseline="central">기록 · 승인 · 검수</text>
</g>
<path d="M140 392 L140 346" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="148" y="369" text-anchor="start" dominant-baseline="central">승인 뒤에만 쓰기</text>
<path d="M242 424 L438 424" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
