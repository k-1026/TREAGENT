<path d="M340 264 L340 298" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple">
<rect x="409" y="204" width="108" height="60" rx="8"/>
<text class="th" x="463.0" y="221" text-anchor="middle" dominant-baseline="central">기록 정리</text>
<text class="ts" x="463.0" y="240" text-anchor="middle" dominant-baseline="central">방문 일기</text>
</g>
<path d="M340 136 L340 156 L463 156 L463 202" class="arr" marker-end="url(#arrow)"/>
<path d="M463 264 L463 298" class="arr" marker-end="url(#arrow)"/>
