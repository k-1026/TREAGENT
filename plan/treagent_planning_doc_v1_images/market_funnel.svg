<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="680" height="460" role="img">
<title>시장 규모 TAM SAM SOM</title>
<desc>2025년 여름 4개월 중구 외지인 방문 연인원에서 20~30대 비율, 스마트폰 보유율, 참여율 가정을 곱해 이용자 규모를 구하고, 지자체 계약 금액 층은 별도로 보여 주는 계단 그림. 막대 길이는 값에 비례하지 않는다</desc>
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
.th{font-size:14px;font-weight:700;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#6B6A64;stroke-width:1.5;fill:none}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.zone{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 4}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B6A64" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="460" fill="#FFFFFF"/>
<g class="c-teal">
<rect x="20.0" y="14" width="640" height="62" rx="8"/>
<text class="th" x="340.0" y="36.0" text-anchor="middle" dominant-baseline="central">TAM  중구 외지인 방문 연인원 (2025 여름 4개월)</text>
<text class="ts" x="340.0" y="55.0" text-anchor="middle" dominant-baseline="central">22,899,786명 · 사실 (데이터랩)</text>
</g>
<g class="c-teal">
<rect x="60.0" y="88" width="560" height="62" rx="8"/>
<text class="th" x="340.0" y="110.0" text-anchor="middle" dominant-baseline="central">SAM  × 20~30대 40.19%</text>
<text class="ts" x="340.0" y="129.0" text-anchor="middle" dominant-baseline="central">9,203,424명 · 사실 + 계산</text>
</g>
<g class="c-teal">
<rect x="100.0" y="162" width="480" height="62" rx="8"/>
<text class="th" x="340.0" y="184.0" text-anchor="middle" dominant-baseline="central">도달  × 스마트폰 보유율 96.0%</text>
<text class="ts" x="340.0" y="203.0" text-anchor="middle" dominant-baseline="central">8,835,287명 · 사실 (방미통위)</text>
</g>
<g class="c-purple">
<rect x="140.0" y="236" width="400" height="62" rx="8"/>
<text class="th" x="340.0" y="258.0" text-anchor="middle" dominant-baseline="central">SOM  × 참여율 0.1% / 0.5% / 1.0% (가정)</text>
<text class="ts" x="340.0" y="277.0" text-anchor="middle" dominant-baseline="central">8,835 / 44,176 / 88,353명</text>
</g>
<g class="c-coral">
<rect x="20" y="316" width="640" height="76" rx="8"/>
<text class="th" x="340.0" y="336.0" text-anchor="middle" dominant-baseline="central">금액 층 (판매 방식 A 지자체 직접, 단가 1,000만~2,000만원)</text>
<text class="ts" x="340.0" y="355.0" text-anchor="middle" dominant-baseline="central">SAM: 신규 제안 가능한 구·군 약 7곳(가정) × 1건 = 7,000만~1.4억원 / 년</text>
<text class="ts" x="340.0" y="373.0" text-anchor="middle" dominant-baseline="central">SOM: 1년차 1건, 2년차 3건, 3년차 5건 (가정, 강사 예시)</text>
</g>
<text class="ts" x="20" y="410" text-anchor="start" dominant-baseline="central">연인원은 같은 사람을 날마다 다시 센 값이라 사람 수가 아닙니다. 막대 길이는 값에 비례하지 않습니다.</text>
<rect class="c-teal" x="20" y="434" width="12" height="12" rx="2"/>
<text class="ts" x="38" y="440" dominant-baseline="central">사실 · 계산</text>
<rect class="c-purple" x="121.19999999999999" y="434" width="12" height="12" rx="2"/>
<text class="ts" x="139.2" y="440" dominant-baseline="central">가정이 들어간 값</text>
<rect class="c-coral" x="250.71999999999997" y="434" width="12" height="12" rx="2"/>
<text class="ts" x="268.71999999999997" y="440" dominant-baseline="central">금액 층</text>
</svg>
