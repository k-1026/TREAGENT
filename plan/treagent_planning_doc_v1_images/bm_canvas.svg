<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" role="img">
<title>비즈니스 모델 캔버스 (12블록, 레드팀 반영 v2)</title>
<desc>핵심 파트너, 핵심 활동과 자원, 가치 제안, 고객 관계와 채널, 고객 세그먼트, 비용 구조, 수익원 아홉 칸에 AI 역할, 데이터 원천, 학습 루프 세 칸을 더한 TREAGENT 사업 모델. 레드팀 검증으로 정정한 내용을 반영했다</desc>
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
.th{font-size:14px;font-weight:700;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#6B6A64;stroke-width:1.5;fill:none}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.zone{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 4}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B6A64" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="590" fill="#FFFFFF"/>
<g class="c-teal">
<rect x="10" y="14" width="140" height="300" rx="8"/>
<text class="th" x="80.0" y="83.0" text-anchor="middle" dominant-baseline="central">핵심 파트너</text>
<text class="ts" x="80.0" y="102.0" text-anchor="middle" dominant-baseline="central">지자체 관광부서</text>
<text class="ts" x="80.0" y="120.0" text-anchor="middle" dominant-baseline="central">대구문화예술진흥원</text>
<text class="ts" x="80.0" y="138.0" text-anchor="middle" dominant-baseline="central">행사 대행사</text>
<text class="ts" x="80.0" y="156.0" text-anchor="middle" dominant-baseline="central">장소 운영처</text>
<text class="ts" x="80.0" y="174.0" text-anchor="middle" dominant-baseline="central">기상청 · T맵</text>
<text class="ts" x="80.0" y="192.0" text-anchor="middle" dominant-baseline="central">Gemini</text>
<text class="ts" x="80.0" y="210.0" text-anchor="middle" dominant-baseline="central">Supabase · Vercel</text>
<text class="ts" x="80.0" y="228.0" text-anchor="middle" dominant-baseline="central">Railway</text>
<text class="ts" x="80.0" y="246.0" text-anchor="middle" dominant-baseline="central">합의 0건</text>
</g>
<g class="c-teal">
<rect x="160" y="14" width="140" height="145" rx="8"/>
<text class="th" x="230.0" y="32.5" text-anchor="middle" dominant-baseline="central">핵심 활동</text>
<text class="ts" x="230.0" y="51.5" text-anchor="middle" dominant-baseline="central">코스 제작</text>
<text class="ts" x="230.0" y="69.5" text-anchor="middle" dominant-baseline="central">앱 · 서버 개발</text>
<text class="ts" x="230.0" y="87.5" text-anchor="middle" dominant-baseline="central">운영자 상태 관리</text>
<text class="ts" x="230.0" y="105.5" text-anchor="middle" dominant-baseline="central">(웹 없음)</text>
<text class="ts" x="230.0" y="123.5" text-anchor="middle" dominant-baseline="central">결과 리포트</text>
<text class="ts" x="230.0" y="141.5" text-anchor="middle" dominant-baseline="central">(기록 없음)</text>
</g>
<g class="c-teal">
<rect x="160" y="169" width="140" height="145" rx="8"/>
<text class="th" x="230.0" y="196.5" text-anchor="middle" dominant-baseline="central">핵심 자원</text>
<text class="ts" x="230.0" y="215.5" text-anchor="middle" dominant-baseline="central">하랑이 캐릭터</text>
<text class="ts" x="230.0" y="233.5" text-anchor="middle" dominant-baseline="central">중구 장소 50곳</text>
<text class="ts" x="230.0" y="251.5" text-anchor="middle" dominant-baseline="central">날씨 규칙 엔진</text>
<text class="ts" x="230.0" y="269.5" text-anchor="middle" dominant-baseline="central">에이전트 3개</text>
<text class="ts" x="230.0" y="287.5" text-anchor="middle" dominant-baseline="central">해자 아님</text>
</g>
<g class="c-purple">
<rect x="310" y="14" width="140" height="300" rx="8"/>
<text class="th" x="380.0" y="83.0" text-anchor="middle" dominant-baseline="central">가치 제안</text>
<text class="ts" x="380.0" y="102.0" text-anchor="middle" dominant-baseline="central">휴관 · 운영 변경에</text>
<text class="ts" x="380.0" y="120.0" text-anchor="middle" dominant-baseline="central">맞춰 다음 장소를</text>
<text class="ts" x="380.0" y="138.0" text-anchor="middle" dominant-baseline="central">알려 줌</text>
<text class="ts" x="380.0" y="156.0" text-anchor="middle" dominant-baseline="central"></text>
<text class="ts" x="380.0" y="174.0" text-anchor="middle" dominant-baseline="central">날씨는 설계 가설</text>
<text class="ts" x="380.0" y="192.0" text-anchor="middle" dominant-baseline="central">혼잡은 제외</text>
<text class="ts" x="380.0" y="210.0" text-anchor="middle" dominant-baseline="central"></text>
<text class="ts" x="380.0" y="228.0" text-anchor="middle" dominant-baseline="central">지불자 약속 3개는</text>
<text class="ts" x="380.0" y="246.0" text-anchor="middle" dominant-baseline="central">아직 구현 없음</text>
</g>
<g class="c-coral">
<rect x="460" y="14" width="140" height="145" rx="8"/>
<text class="th" x="530.0" y="41.5" text-anchor="middle" dominant-baseline="central">고객 관계</text>
<text class="ts" x="530.0" y="60.5" text-anchor="middle" dominant-baseline="central">계약 기반</text>
<text class="ts" x="530.0" y="78.5" text-anchor="middle" dominant-baseline="central">맞춤 제작 · 운영</text>
<text class="ts" x="530.0" y="96.5" text-anchor="middle" dominant-baseline="central">동구 · 북구 연속은</text>
<text class="ts" x="530.0" y="114.5" text-anchor="middle" dominant-baseline="central">현직 업체 것</text>
<text class="ts" x="530.0" y="132.5" text-anchor="middle" dominant-baseline="central">(우리 근거 아님)</text>
</g>
<g class="c-coral">
<rect x="460" y="169" width="140" height="145" rx="8"/>
<text class="th" x="530.0" y="196.5" text-anchor="middle" dominant-baseline="central">채널</text>
<text class="ts" x="530.0" y="215.5" text-anchor="middle" dominant-baseline="central">제안 · 데모 영업</text>
<text class="ts" x="530.0" y="233.5" text-anchor="middle" dominant-baseline="central">현장 QR → 웹앱</text>
<text class="ts" x="530.0" y="251.5" text-anchor="middle" dominant-baseline="central">Expo Go</text>
<text class="ts" x="530.0" y="269.5" text-anchor="middle" dominant-baseline="central">사용자 비용:</text>
<text class="ts" x="530.0" y="287.5" text-anchor="middle" dominant-baseline="central">설치 · 가입 · 위치</text>
</g>
<g class="c-coral">
<rect x="610" y="14" width="140" height="300" rx="8"/>
<text class="th" x="680.0" y="83.0" text-anchor="middle" dominant-baseline="central">고객 세그먼트</text>
<text class="ts" x="680.0" y="102.0" text-anchor="middle" dominant-baseline="central">사용자</text>
<text class="ts" x="680.0" y="120.0" text-anchor="middle" dominant-baseline="central">대구 도심 1박 2일</text>
<text class="ts" x="680.0" y="138.0" text-anchor="middle" dominant-baseline="central">혼행객</text>
<text class="ts" x="680.0" y="156.0" text-anchor="middle" dominant-baseline="central"></text>
<text class="ts" x="680.0" y="174.0" text-anchor="middle" dominant-baseline="central">지불자 1순위</text>
<text class="ts" x="680.0" y="192.0" text-anchor="middle" dominant-baseline="central">대행사 / 지자체</text>
<text class="ts" x="680.0" y="210.0" text-anchor="middle" dominant-baseline="central">[결정 필요]</text>
<text class="ts" x="680.0" y="228.0" text-anchor="middle" dominant-baseline="central"></text>
<text class="ts" x="680.0" y="246.0" text-anchor="middle" dominant-baseline="central">구매 근거 없음</text>
</g>
<g class="c-gray">
<rect x="10" y="324" width="370" height="120" rx="8"/>
<text class="th" x="195.0" y="348.0" text-anchor="middle" dominant-baseline="central">비용 구조</text>
<text class="ts" x="195.0" y="367.0" text-anchor="middle" dominant-baseline="central">인건비 월 225만원 / 인 (단일 출처)</text>
<text class="ts" x="195.0" y="385.0" text-anchor="middle" dominant-baseline="central">클라우드 월 60,012원 · Railway 요금 미확인</text>
<text class="ts" x="195.0" y="403.0" text-anchor="middle" dominant-baseline="central">공통 개발비 1,500만원 (가정)</text>
<text class="ts" x="195.0" y="421.0" text-anchor="middle" dominant-baseline="central">운영 1개월 가정 · AI 호출비 · 영업비 미계산</text>
</g>
<g class="c-gray">
<rect x="390" y="324" width="360" height="120" rx="8"/>
<text class="th" x="570.0" y="348.0" text-anchor="middle" dominant-baseline="central">수익원</text>
<text class="ts" x="570.0" y="367.0" text-anchor="middle" dominant-baseline="central">비교 기준: 구 · 군 계약 1,080만~2,071만원</text>
<text class="ts" x="570.0" y="385.0" text-anchor="middle" dominant-baseline="central">(범위가 같지 않음, 확인값)</text>
<text class="ts" x="570.0" y="403.0" text-anchor="middle" dominant-baseline="central">첫 제안가 1,000만원 (가정), 확장형 1,800만~2,000만원</text>
<text class="ts" x="570.0" y="421.0" text-anchor="middle" dominant-baseline="central">민간 팀권은 보류</text>
</g>
<g class="c-purple">
<rect x="10" y="454" width="240" height="112" rx="8"/>
<text class="th" x="130.0" y="474.0" text-anchor="middle" dominant-baseline="central">AI 역할</text>
<text class="ts" x="130.0" y="493.0" text-anchor="middle" dominant-baseline="central">에이전트 3개 + 라우터 · 평가자</text>
<text class="ts" x="130.0" y="511.0" text-anchor="middle" dominant-baseline="central">안전 · 인증 · 점수는 코드가 판정</text>
<text class="ts" x="130.0" y="529.0" text-anchor="middle" dominant-baseline="central">틀렸을 때 책임자: 미정</text>
<text class="ts" x="130.0" y="547.0" text-anchor="middle" dominant-baseline="central">[결정 필요]</text>
</g>
<g class="c-purple">
<rect x="260" y="454" width="240" height="112" rx="8"/>
<text class="th" x="380.0" y="474.0" text-anchor="middle" dominant-baseline="central">데이터 원천</text>
<text class="ts" x="380.0" y="493.0" text-anchor="middle" dominant-baseline="central">기상청 · T맵 · Gemini · 웹 검색</text>
<text class="ts" x="380.0" y="511.0" text-anchor="middle" dominant-baseline="central">장소 자료 (영업시간 17 / 48곳)</text>
<text class="ts" x="380.0" y="529.0" text-anchor="middle" dominant-baseline="central">이용 조건 대부분 확인 필요</text>
<text class="ts" x="380.0" y="547.0" text-anchor="middle" dominant-baseline="central">방문 기록 테이블 없음</text>
</g>
<g class="c-purple">
<rect x="510" y="454" width="240" height="112" rx="8"/>
<text class="th" x="630.0" y="474.0" text-anchor="middle" dominant-baseline="central">학습 루프</text>
<text class="ts" x="630.0" y="493.0" text-anchor="middle" dominant-baseline="central">인증률 · 완주율 · 폴백 비율</text>
<text class="ts" x="630.0" y="511.0" text-anchor="middle" dominant-baseline="central">정의만 있고 측정 도구 없음</text>
<text class="ts" x="630.0" y="529.0" text-anchor="middle" dominant-baseline="central">경쟁사도 리포트 제공</text>
<text class="ts" x="630.0" y="547.0" text-anchor="middle" dominant-baseline="central">설계 수준</text>
</g>
<rect class="c-teal" x="10" y="576" width="12" height="12" rx="2"/>
<text class="ts" x="28" y="582" dominant-baseline="central">만드는 쪽</text>
<rect class="c-purple" x="100.64" y="576" width="12" height="12" rx="2"/>
<text class="ts" x="118.64" y="582" dominant-baseline="central">가치 · AI</text>
<rect class="c-coral" x="192.24" y="576" width="12" height="12" rx="2"/>
<text class="ts" x="210.24" y="582" dominant-baseline="central">고객 쪽</text>
<rect class="c-gray" x="271.12" y="576" width="12" height="12" rx="2"/>
<text class="ts" x="289.12" y="582" dominant-baseline="central">돈</text>
</svg>
