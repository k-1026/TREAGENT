<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>날씨·쉼터 목업 v1 (S-14, 날씨와 쉼터 분리)</title>
<meta name="description" content="날씨 상세와 가까운 쉼터를 두 개의 화면으로 나눈 목업. 홈 날씨 뱃지에서 날씨 화면으로, 홈 배너의 쉼터 버튼에서 쉼터 화면으로 들어갑니다. 두 화면은 같은 디자인 규칙을 씁니다. 폭염·호우·날씨 확인 불가일 때 기준 시각, 운영 시간, AWS 여부를 함께 적습니다 (CLAUDE.md 안전 정보 규칙).">
<style>
  :root{
    --ink:#5b2a22; --cream:#fbefdc; --cream2:#f3dfc0; --beam:#a85a24; --paper:#fffaf1; --red:#d03a2f; --red-d:#9c2420;
    --muted:#7a5a4c; --shade:#d9bf98;
    --font:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#e9e4dc;color:var(--ink);font-family:var(--font)}
  body{display:flex;flex-direction:column;align-items:center;padding:12px 12px 28px;gap:10px}
  .ctrl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;font-size:14px;max-width:760px}
  .ctrl select{font:inherit;padding:5px 8px;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:0}
  .phone{position:relative;width:390px;height:844px;background:var(--cream);overflow:hidden;box-shadow:0 0 0 3px var(--ink),0 14px 36px rgba(60,40,20,.28)}
  /* 홈 목업 안에 끼워 쓸 때(?embed=s): 조작판과 상단 바를 숨기고 쉼터 화면 내용만 보임 */
  .embed body{padding:0;background:transparent;display:block}
  .embed .ctrl,.embed .status,.embed .top{display:none}
  .embed .phone{box-shadow:none;width:390px;height:auto;min-height:0;overflow:visible}
  .embed .view{position:relative;top:0;bottom:auto;width:390px;height:auto}
  .embed .pbody{position:static;padding:16px 18px 24px;height:auto}
  .status{position:absolute;left:0;top:0;width:390px;height:40px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:13px;font-weight:700;color:#fff3e0;background:var(--beam);z-index:20}
  .top{position:absolute;left:0;top:40px;width:390px;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--beam);border-bottom:3px solid var(--ink);z-index:19}
  .top b{color:#fff;font-size:18px;text-shadow:2px 2px 0 var(--ink)}
  .navbtn{border:0;background:var(--cream);padding:6px 11px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 0 0 2px var(--ink);color:var(--ink)}
  .view{position:absolute;left:0;top:100px;width:390px;bottom:0;display:none}
  .view.on{display:block}
  .pbody{position:absolute;left:0;top:0;width:390px;bottom:0;overflow:auto;padding:16px 18px 28px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--paper);padding:16px 18px;box-shadow:0 0 0 2px var(--ink)}
  .card b{display:block;font-size:17px;line-height:1.4}
  .card small{display:block;font-size:14px;color:var(--muted);margin-top:6px;line-height:1.5}
  .wx{display:flex;gap:12px;align-items:center}
  .wx i{width:22px;height:22px;flex:none;display:block;box-shadow:0 0 0 2px var(--ink)}
  .banner{padding:14px 16px;font-size:16px;line-height:1.5;font-weight:700;box-shadow:0 0 0 2px var(--ink)}
  .banner.warn{background:#ffe1d6;color:var(--red-d)}
  .banner.storm{background:#dfe7f0;color:#2f4a6b}
  .banner.grey{background:#e6e1da;color:var(--ink)}
  .banner.ok{background:#e4ecd9;color:#2e4a1f}
  .h{font-size:17px;font-weight:800;margin:4px 2px 0}
  .h small{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:2px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:2px dashed var(--shade);font-size:15px;line-height:1.5}
  .row:last-child{border-bottom:0}
  .row span:first-child{color:var(--muted);flex:none}
  .shelter{display:flex;align-items:center;gap:12px}
  .shelter .ico{width:48px;height:48px;background:var(--cream2);box-shadow:0 0 0 2px var(--ink);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex:none}
  .shelter .tx{flex:1}
  .btn{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;height:56px;padding:0;line-height:1;border:0;background:var(--paper);color:var(--ink);font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 0 0 3px var(--ink)}
  .btn.primary{background:var(--red);color:#fff}
</style>
</head>
<body>

<div class="ctrl" role="group" aria-label="목업 조작 (실제 화면에는 없음)">
  <label>날씨 상태 <select id="wx">
    <option value="normal">보통</option>
    <option value="heat">폭염특보</option>
    <option value="storm">호우·이동 보류</option>
    <option value="unknown">날씨 확인 불가</option>
  </select></label>
  <label>화면 <select id="scr">
    <option value="w">날씨 (홈 뱃지에서 들어옴)</option>
    <option value="s">쉼터 (홈 배너 쉼터 버튼에서 들어옴)</option>
  </select></label>
</div>

<main class="phone" id="phone">
  <div class="status"><span>9:41</span><span>●●● ▮</span></div>
  <header class="top">
    <button class="navbtn" id="back" aria-label="뒤로">‹ 홈</button>
    <b id="title">날씨</b>
    <span style="width:62px"></span>
  </header>

  <!-- 날씨 화면 -->
  <section class="view" id="vW">
    <div class="pbody">
      <div class="banner" id="wBan"></div>
      <div class="card">
        <div class="wx"><i id="wxi"></i><div><b id="wxBig"></b><small id="wxSub"></small></div></div>
      </div>
      <div class="card">
        <div class="row"><span>측정 방식</span><span>[AWS 여부 · 확인 필요]</span></div>
        <div class="row"><span>측정 시각</span><span>[기준 시각]</span></div>
        <div class="row"><span>다음 갱신</span><span>[시각 자리]</span></div>
      </div>
      <div class="card">
        <b>이 날씨에 할 수 있는 것</b>
        <div id="doList" style="margin-top:8px"></div>
      </div>
      <button class="btn primary" id="toShelter">가까운 쉼터 보기</button>
    </div>
  </section>

  <!-- 쉼터 화면 -->
  <section class="view" id="vS">
    <div class="pbody">
      <div class="banner" id="sBan"></div>
      <div class="h">가까운 쉼터 <small>운영 시간은 방문 전에 한 번 더 확인해 주세요</small></div>
      <div id="shList" style="display:flex;flex-direction:column;gap:12px"></div>
      <button class="btn primary" data-go="지도에서 길 안내 (자리)">지도에서 길 안내 보기 [자리]</button>
      <button class="btn" id="toWeather">날씨 보기</button>
    </div>
  </section>

  <div class="toast" id="toast" style="display:none"></div>
</main>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  // 홈 날씨 뱃지와 같은 색: 보통 노랑, 폭염 빨강, 호우 남색, 확인 불가 회색
  var WX={
    normal:{title:'날씨', big:'맑음', sub:'체감 [○]℃ · [기준 시각] 기준', color:'#f5b82e', cls:'ok',
      ban:'야외 길을 그대로 안내해요.', doList:['야외 코스: 표시','쉼터: 필요할 때 보기']},
    heat:{title:'폭염', big:'폭염특보', sub:'체감 [○]℃ · [기준 시각] 기준', color:'#dc3b30', cls:'warn',
      ban:'야외 길 안내를 멈췄어요. 쉼터를 먼저 봐요.', doList:['야외 코스: 숨김 (실내 경로로 바뀜)','쉼터: [운영 시간]까지 운영']},
    storm:{title:'호우', big:'호우·이동 보류', sub:'강수 [○]mm · [기준 시각] 기준', color:'#2f4a6b', cls:'storm',
      ban:'신규 이동을 보류했어요. 안전한 곳에서 기다려요.', doList:['야외 코스: 숨김','쉼터: [운영 시간]까지 운영']},
    unknown:{title:'날씨 확인', big:'날씨를 불러오지 못했어요', sub:'[기준 시각] 기준 · 확인 중', color:'#b9b2a8', cls:'grey',
      ban:'날씨를 확인할 수 없어 길을 권하지 않아요. 쉼터 안내만 보여 드려요.', doList:['야외 코스: 권하지 않음','쉼터: 방문 전에 운영 여부를 확인해요']}
  };
  // 쉼터 3곳 (이름, 운영 시간, 도보 시간은 예시)
  var SHELTERS=[
    {n:'[쉼터 1 이름 예시]', t:'운영 [시간 예시]까지 · 도보 약 5분 [예시]'},
    {n:'[쉼터 2 이름 예시]', t:'운영 [시간 예시]까지 · 도보 약 9분 [예시]'},
    {n:'[쉼터 3 이름 예시]', t:'운영 [시간 예시]까지 · 도보 약 12분 [예시]'}
  ];
  var toastT;
  function toast(t){var el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toastT);toastT=setTimeout(function(){el.style.display='none'},1600)}

  function renderWeather(){
    var k=$('#wx').value, w=WX[k];
    $('#wBan').className='banner '+w.cls;
    $('#wBan').textContent=w.ban;
    $('#wxi').style.background=w.color;
    $('#wxBig').textContent=w.big;
    $('#wxSub').textContent=w.sub;
    $('#doList').innerHTML=w.doList.map(function(x){return '<div class="row"><span>·</span><span style="color:var(--ink);flex:1;text-align:left">'+x+'</span></div>'}).join('');
  }
  function renderShelter(){
    var k=$('#wx').value, w=WX[k];
    $('#sBan').className='banner '+w.cls;
    $('#sBan').textContent=w.ban;
    $('#shList').innerHTML=SHELTERS.map(function(s,i){
      return '<div class="card shelter"><div class="ico">'+(i+1)+'</div><div class="tx"><b>'+s.n+'</b><small>'+s.t+'</small><small>AWS 여부 [확인 필요]</small></div></div>';
    }).join('');
  }
  function show(which){
    var w = which==='w';
    $('#vW').classList.toggle('on', w);
    $('#vS').classList.toggle('on', !w);
    $('#scr').value = which;
    $('#title').textContent = w ? '날씨' : '가까운 쉼터';
  }

  $('#wx').addEventListener('change',function(){ renderWeather(); renderShelter(); });
  $('#scr').addEventListener('change',function(){ show($('#scr').value); });
  $('#toShelter').addEventListener('click',function(){ show('s'); });
  $('#toWeather').addEventListener('click',function(){ show('w'); });
  document.addEventListener('click',function(e){
    var g=e.target.closest('[data-go]'); if(g){ toast('→ '+g.dataset.go); }
    if(e.target.closest('#back')){ if(history.length>1){ history.back(); } else { location.href='app_home_mockup_v1.html'; } }
  });
  var P=new URLSearchParams(location.search);
  if(P.get('wx') && WX[P.get('wx')]) $('#wx').value=P.get('wx');
  if(P.get('embed')==='s'){
    document.documentElement.classList.add('embed');
    document.body.classList.add('embed');
    renderWeather(); renderShelter(); show('s');
    return;
  }
  renderWeather(); renderShelter(); show('w');
})();
</script>
</body>
</html>
