name: dev → main 자동 승격

# dev에 쌓인 변경을 정해진 시간에 main으로 올립니다.
# 순서: 점검 → PR 만들기 → Create a merge commit으로 병합 → main을 dev에 합치기 → Pages 다시 배포
# 병합되면 main을 보는 Vercel(웹)과 Railway(서버)가 자동으로 다시 배포됩니다.
#
# 멈추기: 저장소 Settings > Secrets and variables > Actions > Variables에서 AUTO_PROMOTE를 false로 둡니다.
# 필요한 설정(저장소 관리자가 1회): Settings > Actions > General >
#   "Allow GitHub Actions to create and approve pull requests"를 켭니다.
# 스케줄 워크플로는 기본 브랜치(main)에 있는 파일만 실행됩니다. 이 파일이 main에 올라간 뒤부터 동작합니다.
on:
  schedule:
    # [결정 필요] 시각: 지금은 매주 금요일 18:00 (한국 시간) = UTC 09:00
    - cron: '0 9 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

# 승격이 겹치지 않게 하나씩 처리합니다.
concurrency:
  group: promote-dev-to-main
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ vars.AUTO_PROMOTE != 'false' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: 올릴 변경이 있는지 확인
        id: diff
        run: |
          git fetch origin main dev
          ahead=$(git rev-list --count origin/main..origin/dev)
          echo "dev가 main보다 앞선 커밋: ${ahead}개"
          echo "ahead=${ahead}" >> "$GITHUB_OUTPUT"

      # html 배포 점검: 없는 파일 참조, <title> 없음 등이 있으면 여기서 멈춥니다 (build_site.py가 실패 코드로 끝남).
      - name: html 빌드 점검
        if: steps.diff.outputs.ahead != '0'
        run: python3 .github/scripts/build_site.py

      - name: PR 만들고 병합
        if: steps.diff.outputs.ahead != '0'
        run: |
          pr=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            {
              echo "정해진 시간에 자동으로 올리는 \`dev → main\` PR입니다 (.github/workflows/promote-dev-to-main.yml)."
              echo
              echo "## 올라가는 커밋"
              git log origin/main..origin/dev --pretty='- %s'
              echo
              echo "## 확인"
              echo "- html 빌드 점검(\`build_site.py\`): 통과 (실패하면 이 PR은 만들어지지 않습니다)"
              echo "- 앱 실행, 개인정보, EXIF 확인: 자동 검사 없음 (미확인)"
              echo
              echo "병합 방식: Create a merge commit. \`dev\` 브랜치는 지우지 않습니다."
            } > "$RUNNER_TEMP/pr_body.md"
            gh pr create --base main --head dev \
              --title "dev → main: $(date -u +%F) 자동 승격" \
              --body-file "$RUNNER_TEMP/pr_body.md"
            pr=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')
          fi
          echo "PR #${pr}"
          # 병합 가능 여부가 계산되기까지 몇 번 다시 시도합니다.
          for i in 1 2 3 4 5; do
            if gh pr merge "$pr" --merge; then
              echo "병합 완료"
              exit 0
            fi
            echo "병합 실패, 20초 뒤 다시 시도 (${i}/5)"
            sleep 20
          done
          echo "병합하지 못했습니다. PR #${pr}을 직접 확인하세요 (충돌 등)."
          exit 1

      # 병합 커밋이 main에만 생기므로 dev에 합쳐 이력을 맞춥니다. dev는 삭제하지 않습니다.
      - name: main을 dev에 합치기
        if: steps.diff.outputs.ahead != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main dev
          git checkout dev
          git merge origin/main --no-edit
          git push origin dev

      # 이 워크플로의 병합은 다른 워크플로를 자동으로 깨우지 않으므로 Pages 배포를 직접 실행합니다.
      - name: Pages 다시 배포
        if: steps.diff.outputs.ahead != '0'
        run: gh workflow run deploy-pages.yml --ref main
