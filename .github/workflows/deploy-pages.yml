name: HTML 배포 (GitHub Pages)

# main에 html과 html이 쓰는 파일(이미지 등)이 병합되면 사이트를 다시 만들어 배포합니다.
# 사이트 만드는 규칙: .github/scripts/build_site.py, 제외할 경로: .github/site/exclude.txt
# 처음 한 번 저장소 Settings > Pages > Source를 "GitHub Actions"로 바꿔야 배포됩니다.
on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.webp'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.svg'
      - '**/*.gif'
      - '**/*.css'
      - '**/*.js'
      - '.github/scripts/build_site.py'
      - '.github/site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않게 하나씩 처리합니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 사이트 폴더 만들기
        run: python3 .github/scripts/build_site.py --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v4
