name: 브랜치 생성 시 이슈와 프로젝트 등록

# 새 브랜치가 만들어지면 이슈 양식(.github/ISSUE_TEMPLATE/task.md)으로 이슈를 열고 프로젝트에 추가합니다.
# 프로젝트 상태는 "할 일"로 설정합니다.
on:
  create:

permissions:
  issues: write

jobs:
  branch-to-issue:
    # 브랜치 생성만 처리하고, main은 제외합니다.
    if: github.event.ref_type == 'branch' && github.event.ref != 'main'
    runs-on: ubuntu-latest
    env:
      # 프로젝트에 쓰려면 PROJECT_TOKEN이 필요합니다. 없으면 기본 토큰으로 이슈만 만듭니다.
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN != '' && secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
      HAS_PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN != '' }}
      BRANCH: ${{ github.event.ref }}
      ACTOR: ${{ github.actor }}
      REPO: ${{ github.repository }}
      PROJECT_OWNER: ${{ github.repository_owner }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      PROJECT_STATUS_FIELD: 상태
      PROJECT_STATUS_TODO: 할 일
    steps:
      - name: 저장소에 task 라벨 준비
        run: gh label create task --repo "$REPO" --color 0E8A16 --description "작업 등록 이슈" --force

      - name: 이슈 생성 (작업 등록 양식 사용)
        run: |
          # 이슈 양식의 front matter(첫 --- 블록)를 빼고 본문만 씁니다. 양식을 고치면 여기도 따라갑니다.
          awk 'BEGIN{c=0} /^---$/{c++; next} c>=2{print}' .github/ISSUE_TEMPLATE/task.md > issue_body.md
          { echo "브랜치 \`${BRANCH}\`에서 시작된 작업입니다. 생성자: @${ACTOR}"; echo; cat issue_body.md; } > issue_final.md
          ISSUE_URL=$(gh issue create --repo "$REPO" --title "$BRANCH" --body-file issue_final.md --label task --assignee "$ACTOR")
          echo "ISSUE_URL=$ISSUE_URL" >> "$GITHUB_ENV"
          echo "생성된 이슈: $ISSUE_URL"

      - name: 프로젝트에 추가하고 상태를 할 일로 설정
        if: env.HAS_PROJECT_TOKEN == 'true' && vars.PROJECT_NUMBER != ''
        run: |
          ITEM_ID=$(gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "$ISSUE_URL" --format json --jq '.id')
          PROJECT_ID=$(gh project view "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --format json --jq '.id')
          FIELD_JSON=$(gh project field-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --format json)
          FIELD_ID=$(echo "$FIELD_JSON" | jq -r --arg n "$PROJECT_STATUS_FIELD" '.fields[] | select(.name==$n) | .id')
          OPTION_ID=$(echo "$FIELD_JSON" | jq -r --arg n "$PROJECT_STATUS_FIELD" --arg o "$PROJECT_STATUS_TODO" '.fields[] | select(.name==$n) | .options[] | select(.name==$o) | .id')
          if [ -n "$FIELD_ID" ] && [ -n "$OPTION_ID" ]; then
            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" --field-id "$FIELD_ID" --single-select-option-id "$OPTION_ID"
          else
            echo "프로젝트에 '$PROJECT_STATUS_FIELD' 필드 또는 '$PROJECT_STATUS_TODO' 옵션이 없어 상태는 설정하지 않았습니다."
          fi
