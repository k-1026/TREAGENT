<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 510" width="680" height="510" role="img">
<title>TREAGENT 새 컴퓨터 세팅 개요</title>
<desc>GitHub에서 코드를 받고, 키 출처에서 .env 값을 받아 앱과 서버를 실행하고 결과를 확인하는 구조도</desc>
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
.th{font-size:14px;font-weight:700;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#6B6A64;stroke-width:1.5;fill:none}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.zone{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 4}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B6A64" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="510" fill="#FFFFFF"/>

<g class="c-gray">
<rect x="205" y="14" width="260" height="48" rx="8"/>
<text class="th" x="335" y="31" text-anchor="middle" dominant-baseline="central">GitHub (dev)</text>
<text class="ts" x="335" y="49" text-anchor="middle" dominant-baseline="central">코드 · package.json · lock</text>
</g>
<line x1="335" y1="64" x2="335" y2="102" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="345" y="84">clone · checkout dev</text>

<rect class="zone" x="20" y="92" width="150" height="360" rx="12"/>
<text class="th" x="36" y="111">키 받는 곳</text>
<rect class="zone" x="190" y="106" width="290" height="346" rx="12"/>
<text class="th" x="206" y="125">내 컴퓨터</text>
<rect class="zone" x="500" y="92" width="160" height="360" rx="12"/>
<text class="th" x="516" y="111">결과 확인</text>

<g class="c-coral">
<rect x="30" y="144" width="130" height="60" rx="8"/>
<text class="th" x="95" y="162" text-anchor="middle" dominant-baseline="central">Supabase</text>
<text class="ts" x="95" y="182" text-anchor="middle" dominant-baseline="central">URL · anon 키</text>
</g>
<g class="c-coral">
<rect x="30" y="252" width="130" height="56" rx="8"/>
<text class="th" x="95" y="268" text-anchor="middle" dominant-baseline="central">Supabase</text>
<text class="ts" x="95" y="285" text-anchor="middle" dominant-baseline="central">service role</text>
<text class="ts" x="95" y="299" text-anchor="middle" dominant-baseline="central">DB 주소</text>
</g>
<g class="c-coral">
<rect x="30" y="318" width="130" height="44" rx="8"/>
<text class="th" x="95" y="333" text-anchor="middle" dominant-baseline="central">Google</text>
<text class="ts" x="95" y="350" text-anchor="middle" dominant-baseline="central">GOOGLE_API_KEY</text>
</g>
<g class="c-coral">
<rect x="30" y="372" width="130" height="62" rx="8"/>
<text class="th" x="95" y="388" text-anchor="middle" dominant-baseline="central">기상청</text>
<text class="ts" x="95" y="406" text-anchor="middle" dominant-baseline="central">KMA 키</text>
<text class="ts" x="95" y="421" text-anchor="middle" dominant-baseline="central">mock이면 생략</text>
</g>

<g class="c-purple">
<rect x="205" y="134" width="260" height="90" rx="8"/>
<text class="th" x="335" y="150" text-anchor="middle" dominant-baseline="central">dev/app · 모든 팀원</text>
<text class="ts" x="335" y="172" text-anchor="middle" dominant-baseline="central">1  .env 복사, 값 3개 채우기</text>
<text class="ts" x="335" y="190" text-anchor="middle" dominant-baseline="central">2  npm install</text>
<text class="ts" x="335" y="208" text-anchor="middle" dominant-baseline="central">3  npx expo start -c</text>
</g>
<g class="c-teal">
<rect x="205" y="246" width="260" height="190" rx="8"/>
<text class="th" x="335" y="262" text-anchor="middle" dominant-baseline="central">dev/server · 서버를 띄울 때만</text>
<text class="ts" x="335" y="286" text-anchor="middle" dominant-baseline="central">1  .env 복사, 값 채우기</text>
<text class="ts" x="335" y="308" text-anchor="middle" dominant-baseline="central">2  Node: npm install</text>
<text class="ts" x="335" y="326" text-anchor="middle" dominant-baseline="central">Docker: 설치 불필요</text>
<text class="ts" x="335" y="348" text-anchor="middle" dominant-baseline="central">3  Node: npm start</text>
<text class="ts" x="335" y="366" text-anchor="middle" dominant-baseline="central">Docker: docker compose</text>
<text class="ts" x="335" y="384" text-anchor="middle" dominant-baseline="central">up --build</text>
<text class="ts" x="335" y="412" text-anchor="middle" dominant-baseline="central">Node 22.9 이상 / Docker Desktop</text>
</g>

<g class="c-gray">
<rect x="510" y="144" width="140" height="60" rx="8"/>
<text class="th" x="580" y="162" text-anchor="middle" dominant-baseline="central">폰 (Expo Go)</text>
<text class="ts" x="580" y="182" text-anchor="middle" dominant-baseline="central">QR · 같은 Wi-Fi</text>
</g>
<g class="c-gray">
<rect x="510" y="248" width="140" height="64" rx="8"/>
<text class="th" x="580" y="265" text-anchor="middle" dominant-baseline="central">서버 확인</text>
<text class="ts" x="580" y="285" text-anchor="middle" dominant-baseline="central">localhost:3000</text>
<text class="ts" x="580" y="301" text-anchor="middle" dominant-baseline="central">/health → ok</text>
</g>
<g class="c-gray">
<rect x="510" y="334" width="140" height="78" rx="8"/>
<text class="th" x="580" y="351" text-anchor="middle" dominant-baseline="central">PC 웹 (선택)</text>
<text class="ts" x="580" y="372" text-anchor="middle" dominant-baseline="central">서버도 로컬로</text>
<text class="ts" x="580" y="388" text-anchor="middle" dominant-baseline="central">CORS_ORIGIN</text>
</g>

<line x1="162" y1="174" x2="203" y2="174" class="arr" marker-end="url(#arrow)"/>
<line x1="162" y1="280" x2="203" y2="280" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line x1="162" y1="340" x2="203" y2="340" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line x1="162" y1="403" x2="203" y2="403" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line x1="467" y1="174" x2="508" y2="174" class="arr" marker-end="url(#arrow)"/>
<line x1="467" y1="280" x2="508" y2="280" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line x1="467" y1="373" x2="508" y2="373" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<line x1="20" y1="480" x2="44" y2="480" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="52" y="480" dominant-baseline="central">필수 (앱)</text>
<line x1="140" y1="480" x2="164" y2="480" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="172" y="480" dominant-baseline="central">선택 (서버를 직접 띄울 때)</text>
</svg>
