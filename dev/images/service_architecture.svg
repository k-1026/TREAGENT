<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 670" width="680" height="670" role="img">
<title>TREAGENT 아키텍처 요약</title>
<desc>앱에서 서버와 Supabase 로그인으로 가고, 서버가 Supabase DB, 기상청 API, Gemini API를 호출하는 구조도</desc>
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
.th{font-size:14px;font-weight:700;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#6B6A64;stroke-width:1.5;fill:none}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.zone{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 4}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B6A64" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="670" fill="#FFFFFF"/>

<rect class="zone" x="20" y="14" width="640" height="178" rx="12"/>
<text class="th" x="36" y="33">앱 · 폰은 Expo Go, 웹은 Vercel</text>
<g class="c-purple">
<rect x="35" y="46" width="610" height="48" rx="8"/>
<text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central">화면</text>
<text class="ts" x="340" y="80" text-anchor="middle" dominant-baseline="central">login · signup · district · today · courses · course</text>
</g>
<g class="c-purple">
<rect x="35" y="122" width="150" height="52" rx="8"/>
<text class="th" x="110" y="140" text-anchor="middle" dominant-baseline="central">supabase.ts</text>
<text class="ts" x="110" y="158" text-anchor="middle" dominant-baseline="central">로그인·가입만</text>
</g>
<g class="c-purple">
<rect x="250" y="122" width="210" height="52" rx="8"/>
<text class="th" x="355" y="140" text-anchor="middle" dominant-baseline="central">server_api.ts</text>
<text class="ts" x="355" y="158" text-anchor="middle" dominant-baseline="central">그 밖의 모든 요청</text>
</g>
<g class="c-purple">
<rect x="510" y="122" width="140" height="52" rx="8"/>
<text class="th" x="580" y="140" text-anchor="middle" dominant-baseline="central">location.ts</text>
<text class="ts" x="580" y="158" text-anchor="middle" dominant-baseline="central">위치 확인</text>
</g>
<line x1="110" y1="96" x2="110" y2="120" class="arr" marker-end="url(#arrow)"/>
<line x1="355" y1="96" x2="355" y2="120" class="arr" marker-end="url(#arrow)"/>
<line x1="580" y1="96" x2="580" y2="120" class="arr" marker-end="url(#arrow)"/>

<rect class="zone" x="20" y="230" width="180" height="372" rx="12"/>
<text class="th" x="36" y="249">Supabase</text>
<g class="c-gray">
<rect x="30" y="262" width="160" height="50" rx="8"/>
<text class="th" x="110" y="279" text-anchor="middle" dominant-baseline="central">Auth</text>
<text class="ts" x="110" y="297" text-anchor="middle" dominant-baseline="central">이메일 · 비밀번호</text>
</g>
<g class="c-gray">
<rect x="30" y="332" width="160" height="124" rx="8"/>
<text class="th" x="110" y="350" text-anchor="middle" dominant-baseline="central">PostgreSQL</text>
<text class="ts" x="110" y="372" text-anchor="middle" dominant-baseline="central">places · place_mode_fit</text>
<text class="ts" x="110" y="390" text-anchor="middle" dominant-baseline="central">courses · course_routes</text>
<text class="ts" x="110" y="408" text-anchor="middle" dominant-baseline="central">parties · party_members</text>
<text class="ts" x="110" y="426" text-anchor="middle" dominant-baseline="central">party_routes (추가만)</text>
</g>
<g class="c-gray">
<rect x="30" y="476" width="160" height="82" rx="8"/>
<text class="th" x="110" y="494" text-anchor="middle" dominant-baseline="central">접근 규칙</text>
<text class="ts" x="110" y="515" text-anchor="middle" dominant-baseline="central">DB는 서버만 접속</text>
<text class="ts" x="110" y="533" text-anchor="middle" dominant-baseline="central">앱은 Auth만 직접</text>
</g>

<rect class="zone" x="240" y="230" width="230" height="372" rx="12"/>
<text class="th" x="256" y="249">서버 · Railway (Express)</text>
<g class="c-teal">
<rect x="250" y="262" width="210" height="44" rx="8"/>
<text class="th" x="355" y="277" text-anchor="middle" dominant-baseline="central">미들웨어</text>
<text class="ts" x="355" y="294" text-anchor="middle" dominant-baseline="central">로그·CORS·토큰·호출 제한</text>
</g>
<g class="c-teal">
<rect x="250" y="320" width="210" height="64" rx="8"/>
<text class="th" x="355" y="336" text-anchor="middle" dominant-baseline="central">라우트</text>
<text class="ts" x="355" y="355" text-anchor="middle" dominant-baseline="central">/weather · /recommend</text>
<text class="ts" x="355" y="371" text-anchor="middle" dominant-baseline="central">/courses · /parties · /health</text>
</g>
<g class="c-teal">
<rect x="250" y="398" width="210" height="44" rx="8"/>
<text class="th" x="355" y="413" text-anchor="middle" dominant-baseline="central">규칙 (decide_mode)</text>
<text class="ts" x="355" y="430" text-anchor="middle" dominant-baseline="central">날씨 → 모드 판정</text>
</g>
<g class="c-teal">
<rect x="250" y="456" width="210" height="44" rx="8"/>
<text class="th" x="355" y="471" text-anchor="middle" dominant-baseline="central">날씨 어댑터</text>
<text class="ts" x="355" y="488" text-anchor="middle" dominant-baseline="central">호출 · 정리 · 캐시</text>
</g>
<g class="c-teal">
<rect x="250" y="514" width="210" height="72" rx="8"/>
<text class="th" x="355" y="530" text-anchor="middle" dominant-baseline="central">AI (LangGraph)</text>
<text class="ts" x="355" y="550" text-anchor="middle" dominant-baseline="central">compose → validate → fallback</text>
<text class="ts" x="355" y="568" text-anchor="middle" dominant-baseline="central">agent ↔ tools → validate</text>
</g>

<rect class="zone" x="495" y="230" width="165" height="372" rx="12"/>
<text class="th" x="511" y="249">외부 서비스</text>
<g class="c-coral">
<rect x="510" y="448" width="138" height="60" rx="8"/>
<text class="th" x="579" y="468" text-anchor="middle" dominant-baseline="central">기상청 API</text>
<text class="ts" x="579" y="488" text-anchor="middle" dominant-baseline="central">격자 단위 날씨</text>
</g>
<g class="c-coral">
<rect x="510" y="518" width="138" height="64" rx="8"/>
<text class="th" x="579" y="538" text-anchor="middle" dominant-baseline="central">Gemini API</text>
<text class="ts" x="579" y="558" text-anchor="middle" dominant-baseline="central">길 구성 · 대사 생성</text>
</g>

<line x1="110" y1="176" x2="110" y2="260" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="120" y="212">로그인·가입</text>
<line x1="355" y1="176" x2="355" y2="260" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="365" y="212">서버 호출</text>
<line x1="250" y1="352" x2="192" y2="352" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="220" y="342" text-anchor="middle">SQL</text>
<line x1="460" y1="478" x2="508" y2="478" class="arr" marker-end="url(#arrow)"/>
<line x1="460" y1="550" x2="508" y2="550" class="arr" marker-end="url(#arrow)"/>

<line x1="20" y1="634" x2="44" y2="634" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="52" y="634" dominant-baseline="central">요청·데이터 흐름</text>
<rect class="c-purple" x="190" y="628" width="12" height="12" rx="2"/>
<text class="ts" x="208" y="634" dominant-baseline="central">앱</text>
<rect class="c-teal" x="250" y="628" width="12" height="12" rx="2"/>
<text class="ts" x="268" y="634" dominant-baseline="central">서버</text>
<rect class="c-gray" x="320" y="628" width="12" height="12" rx="2"/>
<text class="ts" x="338" y="634" dominant-baseline="central">Supabase</text>
<rect class="c-coral" x="420" y="628" width="12" height="12" rx="2"/>
<text class="ts" x="438" y="634" dominant-baseline="central">외부 서비스</text>
</svg>
