<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" width="680" height="390" role="img">
<title>다른 컴퓨터 세팅 흐름</title>
<desc>이 컴퓨터에서 GitHub를 거쳐 다른 컴퓨터로 코드가 가고, .env는 손으로 옮기며, 다른 컴퓨터 안에서 앱과 서버를 실행하는 구조도</desc>
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
.th{font-size:14px;font-weight:700;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#6B6A64;stroke-width:1.5;fill:none}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.zone{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 4}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B6A64" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="390" fill="#FFFFFF"/>

<g class="c-purple">
<rect x="40" y="30" width="180" height="56" rx="8"/>
<text class="th" x="130" y="48" text-anchor="middle" dominant-baseline="central">이 컴퓨터</text>
<text class="ts" x="130" y="68" text-anchor="middle" dominant-baseline="central">수정하고 push</text>
</g>
<g class="c-gray">
<rect x="250" y="30" width="180" height="56" rx="8"/>
<text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">GitHub (dev)</text>
<text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">코드, package.json, lock</text>
</g>
<g class="c-purple">
<rect x="460" y="30" width="180" height="56" rx="8"/>
<text class="th" x="550" y="48" text-anchor="middle" dominant-baseline="central">다른 컴퓨터</text>
<text class="ts" x="550" y="68" text-anchor="middle" dominant-baseline="central">pull 받기</text>
</g>
<line x1="220" y1="58" x2="248" y2="58" class="arr" marker-end="url(#arrow)"/>
<line x1="430" y1="58" x2="458" y2="58" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral">
<rect x="40" y="130" width="400" height="56" rx="8"/>
<text class="th" x="240" y="148" text-anchor="middle" dominant-baseline="central">손으로 옮기는 것 (git에 안 올라감)</text>
<text class="ts" x="240" y="168" text-anchor="middle" dominant-baseline="central">.env 파일 2개 (앱, 서버) = 비밀 키</text>
</g>
<line x1="130" y1="88" x2="130" y2="128" class="arr" marker-end="url(#arrow)"/>
<path d="M440 158 L520 158 L520 92" class="arr" marker-end="url(#arrow)"/>
<line x1="600" y1="88" x2="600" y2="218" class="arr" marker-end="url(#arrow)"/>

<rect class="zone" x="40" y="220" width="600" height="150" rx="12"/>
<text class="th" x="60" y="244">다른 컴퓨터 안에서 실행 (서버는 둘 중 하나)</text>
<g class="c-purple">
<rect x="60" y="262" width="170" height="84" rx="8"/>
<text class="th" x="145" y="282" text-anchor="middle" dominant-baseline="central">앱</text>
<text class="ts" x="145" y="304" text-anchor="middle" dominant-baseline="central">npm install</text>
<text class="ts" x="145" y="322" text-anchor="middle" dominant-baseline="central">npx expo start -c</text>
</g>
<g class="c-purple">
<rect x="255" y="262" width="170" height="84" rx="8"/>
<text class="th" x="340" y="282" text-anchor="middle" dominant-baseline="central">서버: Docker</text>
<text class="ts" x="340" y="304" text-anchor="middle" dominant-baseline="central">docker compose</text>
<text class="ts" x="340" y="322" text-anchor="middle" dominant-baseline="central">up --build</text>
</g>
<g class="c-purple">
<rect x="450" y="262" width="170" height="84" rx="8"/>
<text class="th" x="535" y="282" text-anchor="middle" dominant-baseline="central">서버: Node 직접</text>
<text class="ts" x="535" y="304" text-anchor="middle" dominant-baseline="central">npm install</text>
<text class="ts" x="535" y="322" text-anchor="middle" dominant-baseline="central">npm start</text>
</g>
</svg>
