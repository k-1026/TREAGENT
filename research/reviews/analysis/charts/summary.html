<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리뷰 분류 요약</title>
<style>body{font-family:"Malgun Gothic",sans-serif;margin:24px;color:#222}h2{font-size:16px;margin-top:28px}.row{display:flex;align-items:center;margin:6px 0}.lab{width:120px}.bar{height:18px;background:#2a7f78;margin-right:8px}.n{font-size:13px}.note{font-size:12px;color:#666}</style></head><body>
<h1 style="font-size:20px">리뷰 분류 요약 (n=20)</h1>
<p class="note">막대는 건수입니다. 건수 10 미만인 칸은 비율을 쓰지 않습니다.</p>
<h2>여정 단계별 건수</h2>
<div class="row"><span class="lab">알아보기</span><span class="bar" style="width:60px"></span><span class="n">3</span></div>
<div class="row"><span class="lab">이동</span><span class="bar" style="width:20px"></span><span class="n">1</span></div>
<div class="row"><span class="lab">둘러보기</span><span class="bar" style="width:200px"></span><span class="n">10</span></div>
<div class="row"><span class="lab">먹기</span><span class="bar" style="width:140px"></span><span class="n">7</span></div>
<div class="row"><span class="lab">결제</span><span class="bar" style="width:20px"></span><span class="n">1</span></div>
<div class="row"><span class="lab">재방문</span><span class="bar" style="width:0px"></span><span class="n">0</span></div>
<h2>감정 분포 (건수)</h2>
<div class="row"><span class="lab">긍정 (+)</span><span class="bar" style="width:260px"></span><span class="n">13</span></div>
<div class="row"><span class="lab">중립·혼합 (0)</span><span class="bar" style="width:140px"></span><span class="n">7</span></div>
<div class="row"><span class="lab">부정 (−)</span><span class="bar" style="width:0px"></span><span class="n">0</span></div>
<h2>여름 후기 (2025-07·2026-06~08) 건수</h2>
<p class="note">여름 후기 n=5 (6, 8, 11, 12, 20). 10 미만이므로 비율 없이 건수만 표시.</p>
</body></html>
